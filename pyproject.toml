[project]
name = "todo-mcp"
version = "0.1.0"
description = "Persönliche Aufgabenliste als MCP-Server mit Weboberfläche"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pywebpush>=2.5.0",
    "segno>=1.6.6",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
todo-mcp = "todo_mcp:main"
todo-mcp-reset-2fa = "todo_mcp.admin:reset_two_factor"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
