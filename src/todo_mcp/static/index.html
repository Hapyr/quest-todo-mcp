<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%230b57d0'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<!-- Nur die verwendeten Symbole laden (wenige KB statt der ganzen Schrift). Neues Symbol? Hier alphabetisch ergänzen. -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add,arrow_back,arrow_forward,auto_awesome,auto_stories,calendar_month,center_focus_strong,check,check_circle,checklist,chevron_left,chevron_right,close,content_copy,download,emoji_events,error,event,event_available,event_busy,extension,flag,folder,history,inbox,info,insights,lightbulb,logout,more_time,notifications,notifications_active,notifications_off,pause,pause_circle,pin,play_arrow,play_circle,radio_button_unchecked,rocket_launch,schedule,search,search_off,sell,settings,shield,task_alt,timelapse,timer,verified_user,view_kanban,view_week,wb_sunny&display=block" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafd; --surface: #ffffff; --container: #f0f4f9; --container-high: #e9eef6;
    --text: #1f1f1f; --text-2: #444746; --text-3: #747775; --outline: #c4c7c5; --divider: #e1e3e1;
    --primary: #0b57d0; --on-primary: #ffffff; --primary-container: #d3e3fd; --on-primary-container: #041e49;
    --hover: rgba(68, 71, 70, .08); --danger: #b3261e;
    --p-high: #d93025; --p-medium: #e37400; --p-low: #1a73e8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
    --radius: 16px;
    --inverse: #303030; --on-inverse: #f2f2f2; --inverse-primary: #a8c7fa; --field: #f0f4f9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131314; --surface: #1e1f20; --container: #1e1f20; --container-high: #282a2c;
      --text: #e3e3e3; --text-2: #c4c7c5; --text-3: #8e918f; --outline: #444746; --divider: #333537;
      --primary: #a8c7fa; --on-primary: #062e6f; --primary-container: #0842a0; --on-primary-container: #d3e3fd;
      --hover: rgba(227, 227, 227, .08); --danger: #f2b8b5;
      --p-high: #f28b82; --p-medium: #fdd663; --p-low: #8ab4f8;
      --shadow: 0 1px 3px rgba(0,0,0,.6);
      --inverse: #e3e3e3; --on-inverse: #303030; --inverse-primary: #0b57d0; --field: #2a2b2d;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 14px/1.45 "Google Sans Flex", "Google Sans", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .icon {
    font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 20px;
    line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; user-select: none;
    text-transform: none; letter-spacing: normal; /* sonst greift die Ligatur nicht */
    font-variation-settings: "FILL" 0, "wght" 400, "opsz" 20;
  }
  .icon.fill { font-variation-settings: "FILL" 1, "wght" 400, "opsz" 20; }

  /* --- Kopfzeile --- */
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: 8px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  }
  .bar { display: flex; align-items: center; gap: 12px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; color: var(--text-2); flex-shrink: 0; }
  .brand svg { width: 32px; height: 32px; }
  .search {
    flex: 1; min-width: 0; max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px;
    height: 48px; padding: 0 16px; border-radius: 24px; background: var(--container-high); color: var(--text-2);
  }
  .search:focus-within { background: var(--surface); box-shadow: var(--shadow); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--text); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
    display: grid; place-items: center; color: var(--text-2); flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--hover); }
  .sync { width: 8px; height: 8px; border-radius: 50%; background: #1e8e3e; flex-shrink: 0; transition: background .3s; }
  .sync.stale { background: var(--text-3); }

  .toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; }
  .segmented { display: inline-flex; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden; flex-shrink: 0; }
  .segmented button {
    height: 36px; padding: 0 16px; border: 0; background: transparent; cursor: pointer; display: flex;
    align-items: center; gap: 6px; font-weight: 500; color: var(--text);
  }
  .segmented button + button { border-left: 1px solid var(--outline); }
  .segmented button:hover { background: var(--hover); }
  .segmented button[aria-pressed="true"] { background: var(--primary-container); color: var(--on-primary-container); }
  .segmented .icon { font-size: 18px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline); background: transparent;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 500;
    color: var(--text-2); flex-shrink: 0;
  }
  .chip:hover { background: var(--hover); }
  .chip[aria-pressed="true"] { background: var(--primary-container); border-color: transparent; color: var(--on-primary-container); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  main { padding: 0 max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
  .wrap { max-width: 880px; margin: 0 auto; }

  /* --- Liste --- */
  .group { margin-top: 20px; }
  .group h2 {
    font-size: 14px; font-weight: 500; color: var(--text-2); margin: 0 0 8px 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .group h2 .count { color: var(--text-3); font-weight: 400; }
  .group.overdue h2 { color: var(--danger); }
  .panel { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .row {
    display: flex; align-items: flex-start; gap: 14px; padding: 12px 16px; cursor: pointer; width: 100%;
    background: transparent; border: 0; text-align: left;
  }
  .row + .row { border-top: 1px solid var(--divider); }
  .status-btn {
    border: 0; background: transparent; padding: 0; margin: -6px; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
  }
  .status-btn:hover { background: var(--hover); }
  .status-btn:hover .status.todo { font-variation-settings: "FILL" 0, "wght" 600, "opsz" 20; color: var(--primary); }
  .row:hover { background: var(--hover); }
  .status { color: var(--text-3); margin-top: 1px; }
  .status.doing { color: var(--primary); }
  .status.done { color: var(--primary); }
  .row-main { flex: 1; min-width: 0; }
  .title { font-size: 15px; color: var(--text); overflow-wrap: anywhere; }
  .done-task .title { color: var(--text-3); text-decoration: line-through; }
  .deferred-task .title { color: var(--text-2); }
  .notes {
    color: var(--text-2); font-size: 13px; margin-top: 2px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: pre-line;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .meta:empty { display: none; }
  .tag {
    height: 24px; padding: 0 8px; border-radius: 6px; background: var(--container-high); color: var(--text-2);
    display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .tag .icon { font-size: 15px; }
  .tag.due-overdue { color: var(--danger); }
  .tag.due-today { color: var(--primary); }
  .prio { flex-shrink: 0; margin-top: 2px; }
  .prio.high { color: var(--p-high); } .prio.medium { color: var(--p-medium); } .prio.low { color: var(--p-low); }
  details.fold-group summary {
    list-style: none; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-2);
    display: flex; align-items: center; gap: 8px; margin: 0 0 8px 4px; user-select: none;
  }
  details.fold-group summary::-webkit-details-marker { display: none; }
  details.fold-group summary .icon { transition: transform .2s; }
  details.fold-group[open] summary .icon { transform: rotate(90deg); }

  /* --- Board --- */
  .board {
    display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 16px; margin-top: 8px;
    max-width: 1280px; margin-left: auto; margin-right: auto;
  }
  .column { background: var(--container); border-radius: var(--radius); padding: 12px; min-height: 160px; }
  .column h2 { font-size: 14px; font-weight: 500; margin: 4px 6px 12px; display: flex; align-items: center; gap: 8px; color: var(--text-2); }
  .column h2 .count {
    margin-left: auto; min-width: 24px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--container-high); display: grid; place-items: center; font-size: 12px;
  }
  .card {
    background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
    border: 0; width: 100%; text-align: left; display: block; border-left: 3px solid transparent;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .card:hover { box-shadow: var(--shadow); }
  [data-drag] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .drag-source { opacity: .35; }
  .drag-ghost {
    position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; margin: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); transform-origin: 30px 20px; opacity: .96;
  }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  .column.drop-target { background: var(--primary-container); outline: 2px dashed var(--primary); outline-offset: -2px; }
  .day.drop-target { background: var(--primary-container); box-shadow: inset 0 0 0 2px var(--primary); }
  .card .top { display: flex; gap: 8px; align-items: flex-start; }
  .card .title { flex: 1; }
  .column .empty-col { color: var(--text-3); text-align: center; padding: 24px 0; font-size: 13px; }

  /* --- Kalender --- */
  .cal { max-width: 1280px; margin: 8px auto 0; }
  .cal-head { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .cal-head h2 { font-size: 22px; font-weight: 400; margin: 0 0 0 12px; }
  .outlined-btn {
    height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid var(--outline); background: transparent;
    cursor: pointer; font-weight: 500; margin-right: 4px; white-space: nowrap; flex-shrink: 0;
  }
  .outlined-btn:hover { background: var(--hover); }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .weekday { padding: 10px 8px 6px; font-size: 11px; font-weight: 500; color: var(--text-2); text-align: center; text-transform: uppercase; letter-spacing: .5px; }
  .day {
    min-height: 116px; border-top: 1px solid var(--divider); border-left: 1px solid var(--divider);
    padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: transparent;
    border-right: 0; border-bottom: 0; text-align: left; min-width: 0;
  }
  .day:nth-child(7n + 1) { border-left: 0; }
  .day:hover { background: var(--hover); }
  .day.other { color: var(--text-3); }
  .day.selected { background: var(--hover); }
  .day-num {
    align-self: center; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 500; margin-bottom: 2px;
  }
  .day.today .day-num { background: var(--primary); color: var(--on-primary); }
  .pill {
    font-size: 12px; padding: 1px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--text); background: var(--container-high); border-left: 3px solid var(--text-3);
  }
  .pill.done { color: var(--text-3); text-decoration: line-through; }
  .pill.deferred { color: var(--text-3); font-style: italic; }
  .more { font-size: 11px; color: var(--text-2); padding: 0 6px; font-weight: 500; }
  .dots { display: none; justify-content: center; gap: 3px; flex-wrap: wrap; }
  .dots .dot { width: 6px; height: 6px; }
  .day-detail { margin-top: 20px; }
  .no-date { margin-top: 20px; }

  /* --- Leer- & Detailansicht --- */
  .empty { text-align: center; color: var(--text-2); padding: 72px 16px; }
  .empty .icon { font-size: 56px; color: var(--primary); opacity: .7; }
  .empty h3 { font-size: 20px; font-weight: 400; color: var(--text); margin: 16px 0 8px; }
  .empty p { margin: 0 auto; max-width: 380px; }
  dialog {
    border: 0; padding: 0; border-radius: 28px; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 64px);
    background: var(--surface); color: var(--text); box-shadow: 0 8px 32px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.32); }
  .dlg { padding: 24px; }
  .dlg-head { display: flex; gap: 12px; align-items: flex-start; }
  .dlg-head h3 { flex: 1; font-size: 22px; font-weight: 400; margin: 4px 0 0; overflow-wrap: anywhere; }
  .dlg-status { margin: 12px 0 4px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px;
    font-size: 13px; font-weight: 500; background: var(--container-high); color: var(--text-2);
  }
  .badge.doing { background: var(--primary-container); color: var(--on-primary-container); }
  .fields { margin: 16px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 20px; }
  .fields dt { color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .fields dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dlg-notes {
    margin-top: 20px; padding: 16px; border-radius: 12px; background: var(--container); white-space: pre-wrap;
    overflow-wrap: anywhere; color: var(--text);
  }
  .dlg-notes a { color: var(--primary); }
  .dlg-head .title-input {
    flex: 1; font-family: inherit; font-size: 22px; font-weight: 400; line-height: 1.3; color: var(--text); border: 0; background: transparent;
    resize: none; padding: 6px 10px; margin: -2px 0 0 -10px; border-radius: 8px; overflow: hidden; outline: none;
  }
  .title-input:hover, .f input:hover { background: var(--field); }
  .title-input:focus, .notes-input:focus, .f input:focus { background: var(--container-high); }
  .seg-status { margin: 12px 0 8px; display: flex; width: 100%; max-width: 100%; }
  .seg-status label { display: flex; flex: 1; min-width: 0; }
  .seg-status input, .prio-row input { position: absolute; opacity: 0; pointer-events: none; }
  .seg-status label > span {
    flex: 1; height: 36px; padding: 0 8px; display: flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; font-weight: 500; white-space: nowrap;
  }
  .seg-status label + label > span { border-left: 1px solid var(--outline); }
  .seg-status label > span:hover { background: var(--hover); }
  .seg-status input:checked + span { background: var(--primary-container); color: var(--on-primary-container); }
  .seg-status input:focus-visible + span, .prio-row input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: -2px; }
  .form { margin-top: 8px; }
  .f { display: flex; align-items: center; gap: 14px; min-height: 44px; color: var(--text-2); }
  .f > .icon { width: 24px; text-align: center; flex-shrink: 0; }
  .f input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px;
    padding: 9px 10px; border-radius: 8px; outline: none;
  }
  .f input::placeholder, .notes-input::placeholder, .title-input::placeholder { color: var(--text-3); }
  .f .pair { flex: 1; display: flex; gap: 8px; min-width: 0; }
  .f .pair input[type="date"] { flex: 1.4; } .f .pair input[type="time"] { flex: 1; }
  .prio-row { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 0; }
  .prio-row label > span {
    height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--outline); display: inline-flex;
    align-items: center; gap: 4px; cursor: pointer; font-weight: 500; font-size: 13px;
  }
  .prio-row label > span:hover { background: var(--hover); }
  .prio-row input:checked + span { background: var(--primary-container); border-color: transparent; color: var(--on-primary-container); }
  .prio-row .icon { font-size: 16px; }
  .notes-input {
    display: block; width: 100%; min-height: 110px; margin-top: 12px; padding: 12px 14px; border: 0; border-radius: 12px;
    background: var(--field); color: var(--text); font: inherit; font-size: 14px; resize: vertical; outline: none;
  }
  .form-error { color: var(--danger); font-size: 13px; margin: 8px 2px 0; }
  .dlg-meta { margin-top: 14px; color: var(--text-3); font-size: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dlg-actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
  .dlg-actions .spacer { flex: 1; }
  .btn {
    height: 40px; padding: 0 20px; border-radius: 20px; border: 0; font-weight: 500; cursor: pointer; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn .icon { font-size: 20px; }
  .btn.outlined { border: 1px solid var(--outline); color: var(--text); }
  .btn.outlined:hover { background: var(--hover); }
  .btn.text { color: var(--primary); }
  .btn.text:hover { background: var(--hover); }
  .btn.danger { color: var(--danger); padding: 0 14px; }
  .btn.danger.armed { background: var(--danger); color: var(--surface); }
  .btn.filled { background: var(--primary); color: var(--on-primary); }
  .btn.filled:hover { box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .snack {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 200;
    transform: translate(-50%, 24px); opacity: 0; pointer-events: none; transition: all .2s ease;
    display: flex; align-items: center; gap: 8px; min-height: 48px; max-width: calc(100vw - 32px);
    padding: 6px 8px 6px 16px; border-radius: 8px; background: var(--inverse); color: var(--on-inverse);
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
  }
  .notify p { color: var(--text-2); margin: 8px 0 0; }
  .notify ul { color: var(--text-2); margin: 12px 0 0; padding-left: 20px; }
  .notify li { margin: 4px 0; }
  .notify .state { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: var(--field); }
  .notify .state .icon { color: var(--primary); }
  .snack.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  .snack span { padding-right: 8px; }
  .snack button { height: 36px; padding: 0 12px; border: 0; border-radius: 18px; background: transparent; color: var(--inverse-primary); font-weight: 500; cursor: pointer; }

  /* --- Fokus-Pille in der Kopfzeile --- */
  .run-pill {
    height: 36px; padding: 0 14px 0 10px; border-radius: 18px; border: 1px solid var(--outline); background: transparent;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; flex-shrink: 0; max-width: 260px;
  }
  .run-pill:hover { background: var(--hover); }
  .run-pill .icon { color: var(--primary); }
  .run-pill.running { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
  .run-pill .clock { font-variant-numeric: tabular-nums; }
  .run-pill .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-pill.running .what { font-weight: 400; opacity: .85; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* --- Seitenkopf (Heute, Planen, Quests, Rückblick) --- */
  .page { max-width: 1280px; margin: 8px auto 0; }
  .page-head { display: flex; align-items: flex-end; gap: 12px 20px; flex-wrap: wrap; margin: 8px 0 20px; }
  .page-head h1 { font-size: 28px; font-weight: 400; margin: 0; }
  .page-head .sub { color: var(--text-2); margin: 4px 0 0; }
  .page-head .grow { flex: 1; }
  .week-nav { display: flex; align-items: center; gap: 4px; }
  .week-nav .range { font-weight: 500; margin: 0 6px; white-space: nowrap; }
  .progress { height: 6px; border-radius: 3px; background: var(--container-high); overflow: hidden; }
  .progress > span { display: block; height: 100%; background: var(--primary); border-radius: 3px; max-width: 100%; }
  .today-stats { display: flex; align-items: center; gap: 24px; }
  .stat-inline { text-align: right; }
  .stat-inline b { font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .stat-inline small, .week-progress small { color: var(--text-2); display: block; font-size: 12px; }
  .week-progress { width: 190px; cursor: pointer; }
  .week-progress small { margin-top: 6px; }

  /* --- Heute --- */
  .today { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
  .today > * { min-width: 0; }
  .today > div > .group:first-child { margin-top: 0; }
  .group h2 .aside { margin-left: auto; color: var(--text-3); font-weight: 400; font-variant-numeric: tabular-nums; }
  .row .side { display: flex; align-items: center; gap: 2px; flex-shrink: 0; margin: -8px -8px -8px 0; }
  .row .side .prio { margin: 0 4px; }
  .tracked { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
  .play { color: var(--primary); }
  .row.running { background: color-mix(in srgb, var(--primary-container) 60%, transparent); }
  .row.running .tracked { color: var(--on-primary-container); font-weight: 500; }
  .tag.quest .icon, .tag .icon.fill { font-size: 15px; }
  .tag { max-width: 100%; }
  .tag .tx { overflow: hidden; text-overflow: ellipsis; }
  .tag.carried { color: var(--p-medium); }
  .plan-btn {
    height: 32px; padding: 0 12px 0 8px; border-radius: 16px; border: 1px solid var(--outline); background: transparent;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: var(--primary); flex-shrink: 0;
  }
  .plan-btn:hover { background: var(--hover); }
  .plan-btn .icon { font-size: 18px; }
  .hint-row { padding: 14px 16px; color: var(--text-2); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hint-row .icon { color: var(--text-3); }
  .link-btn { border: 0; background: transparent; color: var(--primary); font-weight: 500; cursor: pointer; padding: 0; }

  /* --- Zeitleiste & Wochenraster --- */
  .timeline-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; position: sticky; top: 132px; }
  .timeline-card h2 {
    font-size: 14px; font-weight: 500; color: var(--text-2); margin: 0; padding: 14px 16px 10px;
    display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--divider);
  }
  .timeline-card h2 .aside { margin-left: auto; color: var(--text-3); font-weight: 400; }
  .tl-scroll { overflow-y: auto; max-height: calc(100vh - 210px); --hour: 44px; }
  .week-card { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .week-card .tl-scroll { max-height: calc(100vh - 230px); min-height: 360px; }
  .tl, .tl-head { display: grid; grid-template-columns: 52px repeat(var(--days), minmax(0, 1fr)); }
  .tl { padding-top: 8px; }
  .tl-head { position: sticky; top: 0; z-index: 4; background: var(--surface); border-bottom: 1px solid var(--divider); }
  .tl-head > div { padding: 8px 4px; text-align: center; font-size: 12px; color: var(--text-2); min-width: 0; }
  .tl-head b { display: block; font-weight: 500; color: var(--text); font-size: 13px; }
  .tl-head .is-today b { color: var(--primary); }
  .tl-head small { font-variant-numeric: tabular-nums; }
  .tl-hour { height: var(--hour); font-size: 11px; color: var(--text-3); text-align: right; padding-right: 8px; transform: translateY(-7px); }
  .tl-day {
    position: relative; border-left: 1px solid var(--divider); min-width: 0;
    background: repeating-linear-gradient(to bottom, var(--divider) 0 1px, transparent 1px var(--hour));
  }
  .tl-day.is-today { background-color: color-mix(in srgb, var(--primary-container) 22%, transparent); }
  .block {
    position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 2px 6px; font: 500 11px/1.3 inherit;
    overflow: hidden; color: #fff; cursor: pointer; border: 0; text-align: left; background: var(--primary);
    white-space: nowrap; text-overflow: ellipsis; z-index: 1;
  }
  .block:hover { filter: brightness(1.08); box-shadow: var(--shadow); z-index: 2; }
  .block.plain { background: var(--container-high); color: var(--text); box-shadow: inset 3px 0 0 var(--text-3); }
  .block.running { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.18) 0 6px, transparent 6px 12px); }
  .now-line { position: absolute; left: -1px; right: 0; height: 2px; background: var(--danger); z-index: 3; pointer-events: none; }
  .now-line::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }

  /* --- Planen --- */
  .plan { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: stretch; }
  .plan .column { flex: 0 0 216px; min-width: 0; min-height: 62vh; }
  .plan .backlog { flex-basis: 288px; position: sticky; left: 0; z-index: 3; box-shadow: 10px 0 12px -12px rgba(0,0,0,.35); }
  .plan .column h2 b { font-weight: 500; }
  .plan .column h2 small { color: var(--text-3); font-weight: 400; font-variant-numeric: tabular-nums; }
  .plan .today-col { box-shadow: inset 0 3px 0 var(--primary); }
  .plan .today-col h2 { color: var(--primary); }
  .plan .past { opacity: .8; }
  .sub-head { font-size: 12px; font-weight: 500; color: var(--text-2); margin: 14px 6px 8px; display: flex; align-items: center; gap: 6px; }
  .sub-head:first-of-type { margin-top: 4px; }
  .card.mini { padding: 10px 12px; }
  .card.mini .title { font-size: 14px; }
  .card.done-task .title { color: var(--text-3); text-decoration: line-through; }
  .column.drop-target { background: var(--primary-container); outline: 2px dashed var(--primary); outline-offset: -2px; }

  /* --- Fokus --- */
  dialog.focus {
    width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; border-radius: 0; margin: 0;
    background: var(--bg); box-shadow: none;
  }
  dialog.focus::backdrop { background: var(--bg); }
  .focus-wrap { min-height: 100%; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 24px 32px; }
  .focus-top { display: flex; align-items: center; gap: 12px; }
  .focus-top .label { margin-left: auto; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .focus-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 32px 0 24px; }
  .focus-title { font-size: 26px; max-width: 720px; overflow-wrap: anywhere; }
  .focus-clock { font-size: clamp(76px, 17vw, 176px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -3px; margin: 8px 0 4px; }
  .focus-state { letter-spacing: 1.5px; font-size: 12px; text-transform: uppercase; color: var(--text-2); }
  .focus-actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  .focus-actions .btn { height: 48px; padding: 0 24px; border-radius: 24px; font-size: 15px; }
  .focus-notes { width: min(720px, 100%); margin: 0 auto; min-height: 120px; }
  .focus-next { width: min(720px, 100%); margin: 24px auto 0; }
  .focus-next h3, .pick h3 { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 0 0 10px; }
  .switch-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .switch-list .chip { max-width: 100%; }
  .switch-list .chip span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .pick { width: min(560px, 100%); text-align: left; }
  .pick .panel { margin-top: 8px; }

  /* --- Quests --- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border-radius: var(--radius); padding: 16px 20px; border: 0; text-align: left; min-width: 0; }
  button.tile { cursor: pointer; } button.tile:hover { box-shadow: var(--shadow); }
  .tile .k, .chart-card h3 { font-size: 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: .6px; font-weight: 500; margin: 0; }
  .tile .v { font-size: 30px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 15px; color: var(--text-2); }
  .tile .hint { color: var(--text-2); font-size: 12px; margin-top: 2px; }
  .tile .progress { margin-top: 10px; }
  .quest-tabs { display: flex; align-items: center; gap: 12px; margin: 24px 0 0; }
  .quest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
  .quest-card {
    background: var(--surface); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; border: 0; text-align: left;
    box-shadow: inset 0 3px 0 var(--qc); display: flex; flex-direction: column; gap: 12px; min-height: 180px; min-width: 0;
  }
  .quest-card:hover { box-shadow: inset 0 3px 0 var(--qc), var(--shadow); }
  .quest-card.completed { opacity: .75; }
  .qhead { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .q-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--qc); color: #fff; flex-shrink: 0; }
  .qtitle { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
  .qsub { color: var(--text-2); font-size: 12px; }
  .qfoot { margin-top: auto; display: flex; align-items: flex-end; gap: 12px; }
  .qfoot .big { font-size: 26px; font-variant-numeric: tabular-nums; }
  .qfoot .end { margin-left: auto; text-align: right; }
  .spark { width: 104px; height: 34px; display: block; margin-bottom: 2px; }
  .quest-card.new { box-shadow: none; border: 2px dashed var(--outline); background: transparent; align-items: center; justify-content: center; color: var(--text-2); font-weight: 500; }
  .quest-card.new:hover { background: var(--hover); box-shadow: none; }
  .quest-card.new .icon { font-size: 28px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; }
  .swatches input { position: absolute; opacity: 0; pointer-events: none; }
  .swatches span { width: 28px; height: 28px; border-radius: 50%; display: block; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
  .swatches input:checked + span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }
  .swatches input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 4px; }
  .dlg .group h2 { margin-left: 0; }
  .dlg .panel { background: var(--container); }
  .muted { color: var(--text-2); font-size: 13px; margin: 0; }

  /* --- Rückblick --- */
  .review-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
  .review-grid .stack { display: grid; gap: 12px; align-content: start; }
  .chart-card { background: var(--surface); border-radius: var(--radius); padding: 16px 20px 18px; min-width: 0; }
  .chart-card h3 { margin-bottom: 16px; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
  .chart-card h3 .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text-3); }
  .chart { position: relative; display: flex; align-items: flex-end; gap: 8px; height: 172px; border-bottom: 1px solid var(--divider); }
  .bar-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
  .bar-val { font-size: 11px; color: var(--text-2); margin-bottom: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .vbar { width: 100%; max-width: 44px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 0 0; overflow: hidden; min-height: 0; }
  .vbar span { display: block; width: 100%; }
  .chart-labels { display: flex; gap: 8px; margin-top: 6px; }
  .chart-labels span { flex: 1; text-align: center; font-size: 11px; color: var(--text-2); min-width: 0; white-space: nowrap; overflow: hidden; }
  .chart-labels .cur { color: var(--text); font-weight: 500; }
  .ref { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--text-3); pointer-events: none; z-index: 1; }
  .ref span { position: absolute; right: 0; top: -17px; font-size: 11px; color: var(--text-3); background: var(--surface); padding-left: 4px; }
  .hbar { display: grid; grid-template-columns: minmax(0, 150px) 1fr auto; gap: 12px; align-items: center; margin: 10px 0; font-size: 13px; }
  .hbar .name { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hbar .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .track { height: 8px; border-radius: 4px; background: var(--container-high); overflow: hidden; }
  .hbar .track span { display: block; height: 100%; border-radius: 4px; }
  .hbar .val { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .split { display: flex; height: 28px; border-radius: 8px; overflow: hidden; background: var(--container-high); }
  .split span { display: block; height: 100%; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  /* --- Hinweise & Anleitung --- */
  .hint-link {
    display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 2px 0; margin-top: 6px;
    color: var(--text-3); font: inherit; font-size: 12.5px; cursor: pointer; text-align: left;
  }
  .hint-link .icon { font-size: 16px; }
  .hint-link:hover { color: var(--primary); }
  .hint-link:hover span:last-child { text-decoration: underline; text-underline-offset: 3px; }
  h2 .hint-link { margin: 0 0 0 4px; font-weight: 400; }
  .focus-main .hint-link { margin-top: 20px; }
  dialog.guide { overflow-y: auto; }
  .guide-top {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 24px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .guide-top .label { margin-left: auto; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-2); }
  .guide-wrap { max-width: 760px; margin: 0 auto; padding: 8px 24px 72px; }
  .guide-wrap .num { font-size: 12px; color: var(--primary); letter-spacing: 1.6px; text-transform: uppercase; font-weight: 500; }
  .guide-hero { padding: 24px 0 40px; }
  .guide-hero h1 { font-size: clamp(32px, 6vw, 46px); font-weight: 400; letter-spacing: -.8px; line-height: 1.12; margin: 10px 0 16px; }
  .guide-hero > p { font-size: 17px; line-height: 1.6; color: var(--text-2); margin: 0; max-width: 620px; }
  .flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 28px 0 0; }
  .flow .arrow { color: var(--text-3); font-size: 18px; }
  .flow-step {
    height: 40px; padding: 0 16px 0 12px; border-radius: 20px; border: 0; background: var(--surface); color: var(--text);
    display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .flow-step .icon { color: var(--primary); }
  .flow-step:hover { box-shadow: var(--shadow); }
  .toc { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 24px; margin-top: 32px; }
  .toc button {
    display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border: 0; border-bottom: 1px solid var(--divider);
    background: transparent; color: var(--text); font: inherit; font-size: 15px; text-align: left; cursor: pointer;
  }
  .toc button:hover { color: var(--primary); }
  .toc .n { color: var(--text-3); font-variant-numeric: tabular-nums; width: 14px; }
  .principle { padding: 44px 0; border-top: 1px solid var(--divider); scroll-margin-top: 64px; }
  .principle h2 { font-size: 30px; font-weight: 400; letter-spacing: -.3px; margin: 8px 0 6px; line-height: 1.2; }
  .principle .essence { font-size: 19px; color: var(--text-2); margin: 0 0 20px; line-height: 1.45; }
  .principle > p { font-size: 15.5px; line-height: 1.7; margin: 0 0 14px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0 0; }
  .compare > div { background: var(--surface); border-radius: 16px; padding: 16px 18px; }
  .compare .k { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 500; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
  .compare .k .icon { font-size: 15px; }
  .compare p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; }
  .compare .worse p { color: var(--text-2); }
  .compare .better { box-shadow: inset 0 0 0 1.5px var(--primary); }
  .compare .better .k { color: var(--primary); }
  .ladder { list-style: none; margin: 24px 0 0; padding: 18px 20px; background: var(--surface); border-radius: 16px; }
  .ladder li { display: grid; grid-template-columns: 92px 1fr; gap: 16px; }
  .ladder .lvl { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); text-align: right; padding: 9px 0; }
  .ladder .what { position: relative; padding: 6px 0 6px 20px; border-left: 2px solid var(--divider); font-size: 15px; line-height: 1.45; }
  .ladder .what::before {
    content: ""; position: absolute; left: -7px; top: 11px; width: 8px; height: 8px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--outline);
  }
  .ladder li:first-child .what { border-image: linear-gradient(transparent 0 12px, var(--divider) 12px) 1; }
  .ladder li:last-child .what { border-image: linear-gradient(var(--divider) 0 12px, transparent 12px) 1; }
  .ladder .quest .lvl { color: var(--primary); font-weight: 500; }
  .ladder .quest .what { font-weight: 500; }
  .ladder .quest .what::before { background: var(--primary); border-color: var(--primary); }
  .questions { list-style: none; counter-reset: q; margin: 24px 0 0; padding: 0; display: grid; gap: 10px; }
  .questions li {
    counter-increment: q; display: flex; gap: 14px; align-items: baseline; background: var(--surface);
    border-radius: 14px; padding: 14px 18px; font-size: 15px; line-height: 1.45;
  }
  .questions li::before { content: counter(q); color: var(--primary); font-weight: 500; font-variant-numeric: tabular-nums; }
  .in-app {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 24px; padding-top: 16px;
    border-top: 1px dashed var(--divider); color: var(--text-2); font-size: 14px; line-height: 1.5;
  }
  .in-app > span:nth-child(2) { flex: 1; min-width: 220px; }
  .in-app > .icon { color: var(--primary); }
  .in-app .btn { height: 36px; padding: 0 12px 0 16px; }
  .in-app .btn .icon { font-size: 18px; }
  .recipe { margin-top: 12px; background: var(--primary-container); color: var(--on-primary-container); border-radius: 28px; padding: 28px 28px 24px; }
  .recipe .num { color: inherit; opacity: .8; }
  .recipe h2 { font-size: 28px; font-weight: 400; margin: 6px 0 14px; }
  .recipe ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .recipe li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; line-height: 1.45; }
  .recipe li .icon { font-size: 20px; margin-top: 1px; }
  .guide-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 28px; color: var(--text-3); font-size: 13px; }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-2); }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch > span { width: 36px; height: 20px; border-radius: 10px; background: var(--outline); position: relative; transition: background .2s; flex-shrink: 0; }
  .switch > span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .2s; }
  .switch input:checked + span { background: var(--primary); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* --- Neue Aufgabe & Einstellungen --- */
  .new-btn {
    height: 40px; padding: 0 18px 0 12px; border-radius: 20px; border: 0; cursor: pointer; flex-shrink: 0;
    background: var(--primary-container); color: var(--on-primary-container); font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .new-btn:hover { box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .fab {
    display: none; position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
    z-index: 50; width: 56px; height: 56px; border-radius: 16px; border: 0; cursor: pointer;
    background: var(--primary-container); color: var(--on-primary-container); box-shadow: 0 3px 10px rgba(0,0,0,.25);
    place-items: center;
  }
  .fab .icon { font-size: 26px; }
  .composer .compose-input { min-height: 140px; margin-top: 16px; font-size: 15px; line-height: 1.5; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .examples .chip { flex-shrink: 1; max-width: 100%; height: auto; min-height: 30px; padding: 5px 10px; white-space: normal; text-align: left; font-weight: 400; font-size: 12.5px; line-height: 1.35; }
  .agent-meta { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--text-2); font-size: 13px; flex-wrap: wrap; }
  .agent-meta .icon { font-size: 18px; color: var(--primary); }
  .agent-meta span:nth-child(2) { flex: 1; min-width: 200px; }
  .agent-reply { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 16px; font-size: 15px; line-height: 1.5; }
  .agent-reply .icon { color: var(--primary); font-size: 20px; margin-top: 1px; }
  .created .row { cursor: pointer; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
    display: inline-block; animation: spin .8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn:disabled { opacity: .6; cursor: default; }
  .settings .set-section { padding: 20px 0 4px; border-top: 1px solid var(--divider); margin-top: 16px; }
  .settings .set-section:first-of-type { border-top: 0; margin-top: 4px; padding-top: 8px; }
  .settings h4 { font-size: 15px; font-weight: 500; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
  .settings h4 .icon { color: var(--primary); }
  .settings .f .lbl { width: 78px; }
  .settings .dlg-actions { margin-top: 12px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .set-status { display: flex; align-items: center; gap: 8px; min-height: 22px; margin-top: 6px; font-size: 13px; color: var(--text-2); }
  .set-status .icon { font-size: 18px; color: #1e8e3e; }
  .set-status.bad, .set-status.bad .icon { color: var(--danger); }
  .fine { font-size: 12px; color: var(--text-3); margin: 8px 0 0; line-height: 1.5; }
  .steps { margin: 10px 0 0; padding-left: 20px; color: var(--text-2); font-size: 13px; line-height: 1.6; }
  .steps code { font-size: 12px; background: var(--container-high); padding: 1px 5px; border-radius: 4px; }
  a.btn { text-decoration: none; color: var(--text); }

  /* --- Sicherheit --- */
  .tfa-steps { margin: 16px 0 0; padding-left: 20px; display: grid; gap: 18px; }
  .tfa-steps li::marker { color: var(--primary); font-weight: 500; }
  .tfa-steps .muted { margin-top: 6px; }
  .qr { margin: 12px 0 8px; display: inline-block; border-radius: 12px; overflow: hidden; line-height: 0; box-shadow: 0 0 0 1px var(--divider); }
  .qr svg { width: 200px; height: 200px; }
  .secret { font-size: 13px; letter-spacing: .5px; background: var(--container-high); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
  .warn {
    display: flex; gap: 12px; margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--container);
    color: var(--text-2); font-size: 13px; line-height: 1.55;
  }
  .warn .icon { color: var(--primary); font-size: 20px; flex-shrink: 0; }
  .warn code { font-size: 12px; background: var(--container-high); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
  .codes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
  .codes code { font-size: 15px; letter-spacing: 1px; text-align: center; padding: 10px; border-radius: 10px; background: var(--container); }

  /* --- Formularergänzungen --- */
  .f .lbl { width: 64px; flex-shrink: 0; font-size: 13px; }
  .f select {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px;
    padding: 9px 6px; border-radius: 8px; outline: none; cursor: pointer;
  }
  .f select:hover, .f select:focus { background: var(--field); }
  .f select option { background: var(--surface); color: var(--text); }

  @media (max-width: 760px) {
    .dlg { padding: 20px 16px; }
    .seg-status label > span .icon { display: none; }
    .seg-status { display: grid; grid-template-columns: 1fr 1fr; border-radius: 12px; }
    .seg-status label:nth-child(odd) > span { border-left: 0; }
    .seg-status label:nth-child(n + 3) > span { border-top: 1px solid var(--outline); }
    .brand span { display: none; }
    .toolbar { gap: 8px; }
    .segmented button { padding: 0 12px; }
    .segmented .label { display: none; }
    .board { grid-template-columns: repeat(4, 85vw); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin: 8px -16px 0; padding-left: 16px; padding-right: 16px; scroll-padding: 16px; }
    .column { scroll-snap-align: start; }
    .day { min-height: 56px; align-items: center; }
    .day .pill, .day .more { display: none; }
    .dots { display: flex; }
    .cal-head h2 { font-size: 18px; margin-left: 4px; }
    .run-pill { padding: 0 10px; }
    .run-pill .what { display: none; }
    .page-head h1 { font-size: 24px; }
    .today { grid-template-columns: 1fr; }
    .timeline-card { position: static; }
    .tl-scroll { max-height: 420px; --hour: 40px; }
    .today-stats { gap: 16px; width: 100%; justify-content: space-between; }
    .stat-inline { text-align: left; }
    .plan { scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 12px; scroll-padding: 16px; }
    .plan .column, .plan .backlog { flex-basis: 82vw; scroll-snap-align: start; }
    .plan .backlog { position: static; box-shadow: none; }
    .review-grid { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: 1fr 1fr; }
    .tile .v { font-size: 24px; }
    .tl-head > div { font-size: 10px; padding: 6px 0; }
    .tl-head b { font-size: 11px; }
    .tl, .tl-head { grid-template-columns: 40px repeat(var(--days), minmax(0, 1fr)); }
    .week-card .block { font-size: 0; padding: 0; }
    .focus-title { font-size: 21px; }
    .hbar { grid-template-columns: minmax(0, 110px) 1fr auto; }
    .compare, .toc { grid-template-columns: 1fr; }
    .new-btn { display: none; }
    .composer .dlg-actions .btn.text[data-close] { display: none; }
    .fab { display: grid; }
    .snack { bottom: max(88px, calc(env(safe-area-inset-bottom) + 72px)); }
    main { padding-bottom: 96px; }
    .week-nav { width: 100%; }
    .week-nav .range { flex: 1; min-width: 0; margin: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; }
    .weeks .bar-val, .weeks + .chart-labels span:nth-child(even) { visibility: hidden; }
    .ladder li { grid-template-columns: 72px 1fr; gap: 12px; }
    .guide-wrap, .guide-top { padding-left: 16px; padding-right: 16px; }
    .principle h2 { font-size: 25px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--primary)"/><path d="M7 12.5l3.2 3.2L17 9" stroke="var(--on-primary)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Aufgaben</span>
    </div>
    <label class="search">
      <span class="icon">search</span>
      <input id="q" type="search" placeholder="Suchen" autocomplete="off">
    </label>
    <span class="sync" id="sync" title="Live"></span>
    <button class="run-pill" id="run-pill" title="Fokus"></button>
    <button class="new-btn" data-compose title="Neue Aufgabe (N)"><span class="icon">add</span><span>Neue Aufgabe</span></button>
    <button class="icon-btn" data-guide="" title="Prinzipien & Anleitung (?)" aria-label="Prinzipien & Anleitung"><span class="icon">auto_stories</span></button>
    <button class="icon-btn" data-settings="" title="Einstellungen" aria-label="Einstellungen"><span class="icon">settings</span></button>
  </div>
  <div class="toolbar">
    <div class="segmented" role="group" aria-label="Ansicht">
      <button data-view="today" title="Heute"><span class="icon">wb_sunny</span><span class="label">Heute</span></button>
      <button data-view="plan" title="Planen"><span class="icon">view_week</span><span class="label">Planen</span></button>
      <button data-view="list" title="Liste"><span class="icon">checklist</span><span class="label">Liste</span></button>
      <button data-view="board" title="Board"><span class="icon">view_kanban</span><span class="label">Board</span></button>
      <button data-view="calendar" title="Kalender"><span class="icon">calendar_month</span><span class="label">Kalender</span></button>
      <button data-view="quests" title="Quests"><span class="icon">rocket_launch</span><span class="label">Quests</span></button>
      <button data-view="review" title="Rückblick"><span class="icon">insights</span><span class="label">Rückblick</span></button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main id="main"></main>
<button class="fab" data-compose aria-label="Neue Aufgabe"><span class="icon">add</span></button>

<dialog id="dlg"><div id="dlg-body"></div></dialog>
<dialog id="focus" class="focus" aria-label="Fokus"><div id="focus-body"></div></dialog>
<dialog id="guide" class="focus guide" aria-label="Prinzipien"><div id="guide-body"></div></dialog>
<div class="snack" id="snack" role="status" aria-live="polite"></div>
<datalist id="project-list"></datalist>

<script>
"use strict";

const STATUS = {
  todo: { label: "Offen", icon: "radio_button_unchecked" },
  doing: { label: "In Arbeit", icon: "timelapse" },
  deferred: { label: "Zurückgestellt", icon: "pause_circle" },
  done: { label: "Erledigt", icon: "check_circle" },
};
const isOpen = (t) => t.status === "todo" || t.status === "doing";
const PRIO = { high: "Hoch", medium: "Mittel", low: "Niedrig" };
const PRIO_RANK = { high: 0, medium: 1, low: 2 };
const HUES = ["#1a73e8", "#1e8e3e", "#d93025", "#f9ab00", "#9334e6", "#12b5cb", "#e52592", "#e8710a"];
const MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const WD_SHORT = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const WD_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const QUEST_COLORS = ["#d93025", "#1a73e8", "#1e8e3e", "#9334e6", "#e8710a", "#12b5cb", "#e52592", "#f9ab00"];
const VIEWS = ["today", "plan", "list", "board", "calendar", "quests", "review"];

const state = {
  tasks: [], quests: [], sessions: [], settings: { weekly_target_hours: 20 },
  today: null, etag: null, clockOffset: 0,
  view: "today", project: null, query: "",
  calMonth: null, calSelected: null, calMode: "month", calWeek: null, pending: 0,
  planWeek: null, reviewWeek: null, questTab: "active", focusTask: null, scroll: {},
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// --- Hilfen ---------------------------------------------------------------

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const linkify = (s) => esc(s).replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const parseDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (iso, n) => { const d = parseDate(iso); d.setDate(d.getDate() + n); return isoDate(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const mondayOf = (iso) => addDays(iso, -((parseDate(iso).getDay() + 6) % 7));
const weekdayIdx = (iso) => (parseDate(iso).getDay() + 6) % 7;
const localDay = (stampIso) => isoDate(new Date(stampIso));
const pad2 = (n) => String(n).padStart(2, "0");
const hhmm = (ms) => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

function relDay(iso) {
  const diff = daysBetween(state.today, iso);
  if (diff === 0) return "heute";
  if (diff === 1) return "morgen";
  if (diff === -1) return "gestern";
  if (Math.abs(diff) < 7) return WD_LONG[weekdayIdx(iso)];
  const d = parseDate(iso);
  return `${d.getDate()}. ${MONTHS[d.getMonth()].slice(0, 3)}.`;
}

function weekRange(monday) {
  const a = parseDate(monday), b = parseDate(addDays(monday, 6));
  if (a.getMonth() === b.getMonth()) return `${a.getDate()}.–${b.getDate()}. ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
  return `${a.getDate()}. ${MONTHS[a.getMonth()].slice(0, 3)}. – ${b.getDate()}. ${MONTHS[b.getMonth()].slice(0, 3)}. ${b.getFullYear()}`;
}

// --- Erfasste Zeit ----------------------------------------------------------

const now = () => Date.now() + state.clockOffset; // Serverzeit, damit der Timer auf allen Geräten gleich läuft
const running = () => state.sessions.find((s) => !s.ended_at);
const sessStart = (s) => Date.parse(s.started_at);
const sessEnd = (s) => (s.ended_at ? Date.parse(s.ended_at) : now());
const sessSecs = (s) => Math.max(0, (sessEnd(s) - sessStart(s)) / 1000);
const sessDay = (s) => localDay(s.started_at);
const sumSecs = (list) => list.reduce((a, s) => a + sessSecs(s), 0);
const taskById = (id) => state.tasks.find((t) => t.id === id);
const questById = (id) => (id ? state.quests.find((q) => q.id === id) : undefined);
const questOfSession = (s) => questById(taskById(s.task_id)?.quest_id);
const taskSecs = (id, day) => sumSecs(state.sessions.filter((s) => s.task_id === id && (!day || sessDay(s) === day)));
const daySessions = (day) => state.sessions.filter((s) => sessDay(s) === day);
const weekSessions = (monday) => { const end = addDays(monday, 6); return state.sessions.filter((s) => { const d = sessDay(s); return d >= monday && d <= end; }); };

function fmtDur(sec) {
  const m = Math.floor(sec / 60);
  if (m < 1) return sec >= 1 ? "<1 min" : "0 min";
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)}:${pad2(m % 60)} h`;
}
const fmtHours = (sec) => sec < 3600 ? fmtDur(sec) : `${(sec / 3600).toLocaleString("de-DE", { maximumFractionDigits: 1 })} h`;
function fmtClock(sec) {
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}

/** Tag im Plan; offene Aufgaben aus vergangenen Tagen rutschen auf heute. */
const plannedFor = (t) => (isOpen(t) && t.plan_date && t.plan_date < state.today ? state.today : t.plan_date);

// Farben nach alphabetischer Reihenfolge vergeben, damit sich Projekte nicht dieselbe Farbe teilen
let projectColors = {};
const allProjects = () => [...new Set(state.tasks.map((t) => t.project).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
const projectColor = (name) => projectColors[name] || HUES[0];

function dueLabel(task) {
  if (!task.due_date) return null;
  const diff = daysBetween(state.today, task.due_date);
  const d = parseDate(task.due_date);
  let text;
  if (diff === 0) text = "Heute";
  else if (diff === 1) text = "Morgen";
  else if (diff === -1) text = "Gestern";
  else if (diff > 1 && diff < 7) text = WD_SHORT[(d.getDay() + 6) % 7] + ".";
  else {
    text = `${d.getDate()}. ${MONTHS[d.getMonth()].slice(0, 3)}.`;
    if (d.getFullYear() !== parseDate(state.today).getFullYear()) text += ` ${d.getFullYear()}`;
  }
  if (task.due_time) text += `, ${task.due_time}`;
  const cls = isOpen(task) && diff < 0 ? "due-overdue" : diff === 0 ? "due-today" : "";
  return { text, cls };
}

function longDate(iso) {
  const d = parseDate(iso);
  return `${["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"][d.getDay()]}, ${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}

function stamp(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("de-DE", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

function sortTasks(list) {
  return [...list].sort((a, b) =>
    (a.due_date || "9999").localeCompare(b.due_date || "9999") ||
    (a.due_time || "99").localeCompare(b.due_time || "99") ||
    (PRIO_RANK[a.priority] ?? 3) - (PRIO_RANK[b.priority] ?? 3) ||
    a.id - b.id);
}

function visibleTasks() {
  const q = state.query.trim().toLowerCase();
  return state.tasks.filter((t) =>
    (!state.project || t.project === state.project) &&
    (!q || t.title.toLowerCase().includes(q) || t.notes.toLowerCase().includes(q) ||
      t.tags.some((x) => x.toLowerCase().includes(q)) || (t.project || "").toLowerCase().includes(q)));
}

// --- Bausteine ------------------------------------------------------------

const questTag = (q) => `<span class="tag quest"><span class="icon fill" style="color:${q.color}">rocket_launch</span><span class="tx">${esc(q.title)}</span></span>`;

function metaChips(t, { project = true, plan = true, quest = true } = {}) {
  const out = [];
  const q = questById(t.quest_id);
  if (quest && q) out.push(questTag(q));
  const due = dueLabel(t);
  if (due) out.push(`<span class="tag ${due.cls}"><span class="icon">event</span>${esc(due.text)}</span>`);
  if (plan && isOpen(t) && t.plan_date) {
    const day = plannedFor(t);
    out.push(`<span class="tag ${day === state.today ? "due-today" : ""}" title="Eingeplant"><span class="icon">event_available</span>${esc(relDay(day))}</span>`);
  }
  if (project && t.project) out.push(`<span class="tag"><span class="dot" style="background:${projectColor(t.project)}"></span>${esc(t.project)}</span>`);
  for (const tag of t.tags) out.push(`<span class="tag">#${esc(tag)}</span>`);
  return out.join("");
}

const prioIcon = (t) => t.priority && t.status !== "done"
  ? `<span class="icon fill prio ${t.priority}" title="Priorität: ${PRIO[t.priority]}">flag</span>` : "";

function statusBtn(t) {
  const label = t.status === "done" ? "Wieder öffnen" : "Als erledigt markieren";
  return `<button class="status-btn" data-toggle="${t.id}" title="${label}" aria-label="${label}">
    <span class="icon status ${t.status} ${t.status === "done" ? "fill" : ""}">${STATUS[t.status].icon}</span></button>`;
}

function row(t) {
  const drag = state.view === "calendar" ? `data-drag="${t.id}"` : "";
  return `<div class="row ${t.status}-task" data-id="${t.id}" ${drag} role="button" tabindex="0">
    ${statusBtn(t)}
    <span class="row-main">
      <div class="title">${esc(t.title)}</div>
      ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ""}
      <div class="meta">${metaChips(t, { project: !state.project })}</div>
    </span>
    ${prioIcon(t)}
  </div>`;
}

function card(t) {
  const border = t.project ? `style="border-left-color:${projectColor(t.project)}"` : "";
  return `<div class="card ${t.status}-task" data-id="${t.id}" data-drag="${t.id}" ${border} role="button" tabindex="0">
    <div class="top"><div class="title">${esc(t.title)}</div>${prioIcon(t)}</div>
    ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ""}
    <div class="meta">${metaChips(t, { project: !state.project })}</div>
  </div>`;
}

function group(title, list, cls = "") {
  if (!list.length) return "";
  return `<section class="group ${cls}"><h2>${title}<span class="count">${list.length}</span></h2>
    <div class="panel">${list.map(row).join("")}</div></section>`;
}

function emptyState() {
  const filtered = state.query || state.project;
  return `<div class="empty"><span class="icon">${filtered ? "search_off" : "task_alt"}</span>
    <h3>${filtered ? "Nichts gefunden" : "Alles erledigt"}</h3>
    <p>${filtered ? "Kein Eintrag passt zu deinem Filter." : "Neue Aufgaben legst du über Claude an, zum Beispiel: „Schreib auf: Steuererklärung bis Freitag.“"}</p></div>`;
}

// --- Ansichten ------------------------------------------------------------

function renderList(tasks) {
  const open = sortTasks(tasks.filter(isOpen));
  const deferred = sortTasks(tasks.filter((t) => t.status === "deferred"));
  const done = tasks.filter((t) => t.status === "done")
    .sort((a, b) => (b.completed_at || "").localeCompare(a.completed_at || ""));
  if (!open.length && !deferred.length && !done.length) return `<div class="wrap">${emptyState()}</div>`;
  const today = state.today, tomorrow = addDays(today, 1), week = addDays(today, 7);
  const by = (fn) => open.filter(fn);
  let html = "";
  html += group("Überfällig", by((t) => t.due_date && t.due_date < today), "overdue");
  html += group("Heute", by((t) => t.due_date === today));
  html += group("Morgen", by((t) => t.due_date === tomorrow));
  html += group("Nächste 7 Tage", by((t) => t.due_date > tomorrow && t.due_date <= week));
  html += group("Später", by((t) => t.due_date > week));
  html += group("Ohne Datum", by((t) => !t.due_date));
  if (!open.length) html += emptyState();
  html += foldGroup("Zurückgestellt", deferred);
  html += foldGroup("Erledigt", done.slice(0, 50), done.length);
  return `<div class="wrap">${html}</div>`;
}

function foldGroup(title, list, total = list.length) {
  if (!list.length) return "";
  return `<details class="group fold-group"><summary><span class="icon">chevron_right</span>${title}
    <span class="count" style="color:var(--text-3);font-weight:400">${total}</span></summary>
    <div class="panel">${list.map(row).join("")}</div></details>`;
}

function renderBoard(tasks) {
  const cols = Object.keys(STATUS).map((status) => {
    let list = tasks.filter((t) => t.status === status);
    list = status === "done"
      ? list.sort((a, b) => (b.completed_at || "").localeCompare(a.completed_at || "")).slice(0, 30)
      : sortTasks(list);
    const total = tasks.filter((t) => t.status === status).length;
    const s = STATUS[status];
    return `<section class="column" data-drop-status="${status}"><h2><span class="icon status ${status} ${status === "done" ? "fill" : ""}">${s.icon}</span>${s.label}
      <span class="count">${total}</span></h2>
      ${list.map(card).join("") || `<div class="empty-col">Keine Aufgaben</div>`}</section>`;
  });
  return `<div class="board">${cols.join("")}</div>`;
}

function renderCalendar(tasks) {
  if (state.calMode === "week") return renderCalWeek();
  if (!state.calMonth) state.calMonth = state.today.slice(0, 7);
  if (!state.calSelected) state.calSelected = state.today;
  const [y, m] = state.calMonth.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  const byDay = {};
  for (const t of sortTasks(tasks)) if (t.due_date) (byDay[t.due_date] ||= []).push(t);

  let cells = WD_SHORT.map((d) => `<div class="weekday">${d}</div>`).join("");
  const weeks = Math.ceil((((first.getDay() + 6) % 7) + new Date(y, m, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const iso = isoDate(d);
    const list = byDay[iso] || [];
    const cls = ["day", d.getMonth() !== m - 1 && "other", iso === state.today && "today", iso === state.calSelected && "selected"].filter(Boolean).join(" ");
    const pills = list.slice(0, 3).map((t) => `<div class="pill ${t.status}" data-id="${t.id}" data-drag="${t.id}"
      style="border-left-color:${t.project ? projectColor(t.project) : "var(--text-3)"}">${t.due_time ? esc(t.due_time) + " " : ""}${esc(t.title)}</div>`).join("");
    const more = list.length > 3 ? `<div class="more">+${list.length - 3} weitere</div>` : "";
    const dots = list.slice(0, 4).map((t) => `<span class="dot" style="background:${!isOpen(t) ? "var(--outline)" : t.project ? projectColor(t.project) : "var(--primary)"}"></span>`).join("");
    cells += `<button class="${cls}" data-day="${iso}"><span class="day-num">${d.getDate()}</span>${pills}${more}<span class="dots">${dots}</span></button>`;
  }

  const sel = byDay[state.calSelected] || [];
  const noDate = sortTasks(tasks.filter((t) => !t.due_date && isOpen(t)));
  return `<div class="cal">
    <div class="cal-head">
      <button class="outlined-btn" data-cal="today">Heute</button>
      <button class="icon-btn" data-cal="prev" aria-label="Vorheriger Monat"><span class="icon">chevron_left</span></button>
      <button class="icon-btn" data-cal="next" aria-label="Nächster Monat"><span class="icon">chevron_right</span></button>
      <h2>${MONTHS[m - 1]} ${y}</h2>
      <span style="flex:1"></span>
      ${calModeToggle()}
    </div>
    <div class="grid">${cells}</div>
    <div class="day-detail wrap">${sel.length ? group(esc(longDate(state.calSelected)), sel)
      : `<section class="group"><h2>${esc(longDate(state.calSelected))}</h2><div class="panel"><div class="row" style="cursor:default;color:var(--text-3)">Keine Aufgaben an diesem Tag</div></div></section>`}</div>
    <div class="no-date wrap">${group("Ohne Datum", noDate)}</div>
  </div>`;
}

// --- Heute ----------------------------------------------------------------

function todayRow(t, { suggest = false } = {}) {
  const run = running();
  const isRun = run?.task_id === t.id;
  const secs = taskSecs(t.id);
  const carried = isOpen(t) && t.plan_date && t.plan_date < state.today;
  const extra = carried ? `<span class="tag carried" title="Liegengeblieben"><span class="icon">history</span>seit ${esc(relDay(t.plan_date))}</span>` : "";
  const action = suggest
    ? `<button class="plan-btn" data-plan-today="${t.id}" title="Für heute einplanen"><span class="icon">add</span>Heute</button>`
    : isOpen(t)
      ? `<button class="icon-btn play" data-play="${t.id}" title="${isRun ? "Pausieren" : "Timer starten"}" aria-label="${isRun ? "Pausieren" : "Timer starten"}"><span class="icon fill">${isRun ? "pause" : "play_arrow"}</span></button>`
      : "";
  return `<div class="row ${t.status}-task ${isRun ? "running" : ""}" data-id="${t.id}" role="button" tabindex="0">
    ${statusBtn(t)}
    <span class="row-main">
      <div class="title">${esc(t.title)}</div>
      <div class="meta">${extra}${metaChips(t, { project: !state.project, plan: suggest })}</div>
    </span>
    <span class="side">
      <span class="tracked" data-live-task="${t.id}">${isRun ? fmtClock(secs) : secs ? fmtDur(secs) : ""}</span>
      ${prioIcon(t)}${action}
    </span>
  </div>`;
}

function todaySection(title, list, { icon = "", empty = "", note = "" } = {}) {
  if (!list.length && !empty) return "";
  const secs = list.reduce((a, t) => a + taskSecs(t.id, state.today), 0);
  return `<section class="group"><h2>${icon}${title}<span class="count">${list.length}</span>${note}
      ${secs ? `<span class="aside">${fmtDur(secs)} heute</span>` : ""}</h2>
    <div class="panel">${list.map((t) => todayRow(t)).join("") || empty}</div></section>`;
}

function weekQuestSecs(monday) {
  return sumSecs(weekSessions(monday).filter((s) => questOfSession(s)));
}

function renderToday(tasks) {
  const today = state.today;
  const planned = tasks.filter((t) => plannedFor(t) === today && t.status !== "deferred");
  const open = sortTasks(planned.filter(isOpen));
  const questWork = open.filter((t) => questById(t.quest_id));
  const other = open.filter((t) => !questById(t.quest_id));
  const done = tasks.filter((t) => t.status === "done" && (t.plan_date === today || (t.completed_at && localDay(t.completed_at) === today)))
    .sort((a, b) => (b.completed_at || "").localeCompare(a.completed_at || ""));
  const suggestions = sortTasks(tasks.filter((t) => isOpen(t) && plannedFor(t) !== today &&
    (t.status === "doing" || (t.due_date && t.due_date <= addDays(today, 1)))));

  const daySecs = sumSecs(daySessions(today));
  const target = state.settings.weekly_target_hours;
  const weekSecs = weekQuestSecs(mondayOf(today));
  const pct = Math.min(100, (100 * weekSecs) / (target * 3600));
  const d = parseDate(today);
  const head = `<div class="page-head">
    <div><h1>${WD_LONG[weekdayIdx(today)]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}</h1>
      <p class="sub">${open.length ? `${open.length} ${open.length === 1 ? "Aufgabe" : "Aufgaben"} im Plan – arbeite so lange an jeder, wie du willst.` : "Noch nichts für heute geplant."}</p>
      ${hint("one", "Eine Aufgabe zur Zeit – es dauert, so lange es dauert.")}</div>
    <span class="grow"></span>
    <div class="today-stats">
      <div class="stat-inline"><b data-live-day="${today}">${fmtDur(daySecs)}</b><small>heute erfasst</small></div>
      <div class="week-progress" data-view="review" title="Zum Rückblick"><div class="progress"><span style="width:${pct}%"></span></div>
        <small>${fmtHours(weekSecs)} von ${target.toLocaleString("de-DE")} h Quest-Zeit diese Woche</small></div>
    </div></div>`;

  const noQuestHint = `<div class="hint-row"><span class="icon">rocket_launch</span>Noch keine Quest-Arbeit geplant.
    <button class="link-btn" data-view="plan">Woche planen</button></div>`;
  let left = todaySection("Quest-Arbeit", questWork, { empty: noQuestHint });
  left += todaySection("Sonstiges", other, { note: hint("coherence", "erst, wenn die Quest-Arbeit steht") });
  if (!open.length && !suggestions.length) {
    left += `<div class="empty"><span class="icon">wb_sunny</span><h3>Ein freier Tag</h3>
      <p>Zieh in <button class="link-btn" data-view="plan">Planen</button> Aufgaben auf heute – ohne feste Uhrzeiten. Dann wählst du hier, woran du arbeitest.</p></div>`;
  }
  if (suggestions.length) {
    left += `<section class="group"><h2>Vorschläge<span class="count">${suggestions.length}</span><span class="aside">fällig oder in Arbeit</span></h2>
      <div class="panel">${suggestions.map((t) => todayRow(t, { suggest: true })).join("")}</div></section>`;
  }
  left += foldGroup("Heute erledigt", done);

  return `<div class="page">${head}<div class="today"><div>${left}</div>
    <aside class="timeline-card"><h2><span class="icon" style="font-size:18px">schedule</span>Zeitleiste
      <span class="aside" data-live-day="${today}">${fmtDur(daySecs)}</span></h2>${timeGrid([today], { head: false })}</aside>
  </div></div>`;
}

// --- Zeitraster (Heute & Kalenderwoche) -----------------------------------

function sessionBlock(s, hourPx) {
  const start = new Date(sessStart(s));
  const startMin = start.getHours() * 60 + start.getMinutes();
  const mins = Math.min(sessSecs(s) / 60, 24 * 60 - startMin); // am Tagesende abschneiden
  const height = Math.max(3, (mins * hourPx) / 60);
  const t = taskById(s.task_id);
  const q = questById(t?.quest_id);
  const title = t ? t.title : "Gelöschte Aufgabe";
  const tip = `${title} · ${hhmm(sessStart(s))}–${s.ended_at ? hhmm(sessEnd(s)) : "läuft"} (${fmtDur(sessSecs(s))})`;
  const action = s.ended_at ? `data-session="${s.id}"` : `data-focus-open="${s.task_id}"`;
  return `<button class="block ${q ? "" : "plain"} ${s.ended_at ? "" : "running"}" ${action} title="${esc(tip)}" aria-label="${esc(tip)}"
    style="top:${(startMin * hourPx) / 60}px;height:${height}px;${q ? `background-color:${q.color}` : ""}">${height >= 15 ? esc(title) : ""}</button>`;
}

const HOUR_PX = () => (matchMedia("(max-width: 760px)").matches ? 40 : 44);

function timeGrid(days, { head = true } = {}) {
  const hourPx = HOUR_PX();
  const hours = Array.from({ length: 24 }, (_, h) => `<div class="tl-hour">${h ? pad2(h) + ":00" : ""}</div>`).join("");
  const nowD = new Date(now());
  const cols = days.map((day) => {
    const blocks = daySessions(day).map((s) => sessionBlock(s, hourPx)).join("");
    const line = day === state.today ? `<div class="now-line" style="top:${((nowD.getHours() * 60 + nowD.getMinutes()) * hourPx) / 60}px"></div>` : "";
    return `<div class="tl-day ${day === state.today && days.length > 1 ? "is-today" : ""}" style="height:${24 * hourPx}px">${blocks}${line}</div>`;
  }).join("");
  const header = head ? `<div class="tl-head" style="--days:${days.length}"><div></div>${days.map((day) => {
    const secs = sumSecs(daySessions(day));
    return `<div class="${day === state.today ? "is-today" : ""}"><b>${WD_SHORT[weekdayIdx(day)]} ${parseDate(day).getDate()}</b>
      <small data-live-day="${day}">${secs ? fmtDur(secs) : "–"}</small></div>`;
  }).join("")}</div>` : "";
  return `<div class="tl-scroll" data-scroll="tl" data-has-today="${days.includes(state.today)}">${header}
    <div class="tl" style="--days:${days.length}"><div>${hours}</div>${cols}</div></div>`;
}

function renderCalWeek() {
  const monday = (state.calWeek ||= mondayOf(state.today));
  const days = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  const sess = weekSessions(monday);
  const total = sumSecs(sess), quest = sumSecs(sess.filter((s) => questOfSession(s)));
  return `<div class="cal">
    <div class="cal-head">
      <button class="outlined-btn" data-cal="today">Heute</button>
      <button class="icon-btn" data-cal="prev" aria-label="Vorherige Woche"><span class="icon">chevron_left</span></button>
      <button class="icon-btn" data-cal="next" aria-label="Nächste Woche"><span class="icon">chevron_right</span></button>
      <h2>${weekRange(monday)}</h2>
      <span style="flex:1"></span>
      ${calModeToggle()}
    </div>
    <div class="week-card">${timeGrid(days)}</div>
    <div class="hint-row" style="padding:12px 4px">
      <span class="icon">timer</span><span>${fmtHours(total)} erfasst · davon ${fmtHours(quest)} Quest-Arbeit</span>
      ${hint("done", "Logbuch statt Zeitblöcke – hier steht, was wirklich war.")}
      <span style="flex:1"></span>
      <button class="outlined-btn" data-log><span class="icon" style="font-size:18px;vertical-align:-4px">more_time</span> Zeit nachtragen</button>
    </div>
  </div>`;
}

const calModeToggle = () => `<div class="segmented" role="group" aria-label="Kalenderansicht">
  <button data-cal-mode="month" aria-pressed="${state.calMode === "month"}">Monat</button>
  <button data-cal-mode="week" aria-pressed="${state.calMode === "week"}">Woche</button></div>`;

// --- Planen ---------------------------------------------------------------

function planCard(t) {
  const q = questById(t.quest_id);
  const secs = taskSecs(t.id);
  const isRun = running()?.task_id === t.id;
  const due = dueLabel(t);
  return `<div class="card mini ${t.status}-task" data-id="${t.id}" data-drag="${t.id}" ${q ? `style="border-left-color:${q.color}"` : ""} role="button" tabindex="0">
    <div class="top"><div class="title">${esc(t.title)}</div>${prioIcon(t)}</div>
    <div class="meta">${q ? questTag(q) : ""}${due ? `<span class="tag ${due.cls}"><span class="icon">event</span>${esc(due.text)}</span>` : ""}${secs || isRun
      ? `<span class="tag"><span class="icon">timer</span><span data-live-task="${t.id}">${isRun ? fmtClock(secs) : fmtDur(secs)}</span></span>` : ""}</div>
  </div>`;
}

function renderPlan(tasks) {
  const monday = (state.planWeek ||= mondayOf(state.today));
  const days = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  const backlog = sortTasks(tasks.filter((t) => isOpen(t) && !t.plan_date));
  const groups = state.quests.map((q) => [q, backlog.filter((t) => t.quest_id === q.id)]).filter(([, l]) => l.length);
  const loose = backlog.filter((t) => !questById(t.quest_id));
  const backlogCol = `<section class="column backlog" data-drop-plan="">
    <h2><span class="icon">inbox</span>Nicht eingeplant<span class="count">${backlog.length}</span></h2>
    ${groups.map(([q, l]) => `<div class="sub-head"><span class="icon fill" style="font-size:16px;color:${q.color}">rocket_launch</span>${esc(q.title)}</div>${l.map(planCard).join("")}`).join("")}
    ${loose.length && groups.length ? `<div class="sub-head">Ohne Quest</div>` : ""}${loose.map(planCard).join("")}
    ${backlog.length ? "" : `<div class="empty-col">Alles eingeplant</div>`}</section>`;

  const cols = days.map((day) => {
    const list = tasks.filter((t) => t.status !== "deferred" && (isOpen(t) ? plannedFor(t) === day : t.plan_date === day));
    const openList = sortTasks(list.filter(isOpen)), doneList = list.filter((t) => !isOpen(t));
    const secs = sumSecs(daySessions(day));
    const past = day < state.today;
    return `<section class="column ${day === state.today ? "today-col" : ""} ${past ? "past" : ""}" data-drop-plan="${day}">
      <h2><span>${WD_SHORT[weekdayIdx(day)]} <b>${parseDate(day).getDate()}</b></span>${secs ? `<small data-live-day="${day}">${fmtDur(secs)}</small>` : ""}
        <span class="count">${openList.length}</span></h2>
      ${[...openList, ...doneList].map(planCard).join("") || `<div class="empty-col">${past ? "–" : "Hierher ziehen"}</div>`}</section>`;
  }).join("");

  return `<div class="page" style="max-width:none">
    <div class="page-head"><div><h1>Woche planen</h1>
      <p class="sub">Zieh Aufgaben auf einen Tag – ohne feste Uhrzeit. Unerledigtes rutscht automatisch auf heute.</p>
      ${hint("day", "Nach Tag planen, nicht nach Stunde: Reihenfolge statt Zeitblöcke.")}</div>
      <span class="grow"></span>
      <div class="week-nav"><button class="outlined-btn" data-week="today">Diese Woche</button>
        <button class="icon-btn" data-week="prev" aria-label="Vorherige Woche"><span class="icon">chevron_left</span></button>
        <span class="range">${weekRange(monday)}</span>
        <button class="icon-btn" data-week="next" aria-label="Nächste Woche"><span class="icon">chevron_right</span></button></div>
    </div>
    <div class="plan" data-scroll="plan">${backlogCol}${cols}</div></div>`;
}

// --- Quests ---------------------------------------------------------------

function sparkline(vals, color) {
  const w = 104, h = 34, max = Math.max(...vals, 1);
  const pts = vals.map((v, i) => [(i * (w - 6)) / (vals.length - 1) + 3, h - 4 - (v / max) * (h - 8)]);
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3" fill="${color}"/></svg>`;
}
