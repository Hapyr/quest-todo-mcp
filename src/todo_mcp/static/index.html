function questCard(q) {
  const monday = mondayOf(state.today);
  const sess = state.sessions.filter((s) => taskById(s.task_id)?.quest_id === q.id);
  const openN = state.tasks.filter((t) => t.quest_id === q.id && isOpen(t)).length;
  const doneN = state.tasks.filter((t) => t.quest_id === q.id && t.status === "done").length;
  const weeks = Array.from({ length: 8 }, (_, i) => addDays(monday, -7 * (7 - i)));
  const perWeek = weeks.map((w) => sumSecs(sess.filter((s) => { const d = sessDay(s); return d >= w && d <= addDays(w, 6); })));
  return `<button class="quest-card ${q.status}" style="--qc:${q.color}" data-quest="${q.id}">
    <div class="qhead"><span class="q-icon"><span class="icon fill">${q.status === "completed" ? "emoji_events" : "rocket_launch"}</span></span>
      <div style="min-width:0"><div class="qtitle">${esc(q.title)}</div><div class="qsub">${openN} offen · ${doneN} erledigt</div></div></div>
    ${q.notes ? `<div class="notes">${esc(q.notes)}</div>` : ""}
    <div class="qfoot"><div><div class="big">${fmtHours(perWeek[7])}</div><div class="qsub">diese Woche</div></div>
      <div class="end">${sparkline(perWeek, q.color)}<div class="qsub">${fmtHours(sumSecs(sess))} gesamt</div></div></div>
  </button>`;
}

function renderQuests() {
  const active = state.quests.filter((q) => q.status === "active");
  const completed = state.quests.filter((q) => q.status === "completed");
  const list = state.questTab === "completed" ? completed : active;
  const allSecs = sumSecs(state.sessions.filter((s) => questOfSession(s)));
  const cards = list.map(questCard).join("") +
    (state.questTab === "active" ? `<button class="quest-card new" data-quest="new"><span class="icon">add</span>Neue Quest</button>` : "");
  return `<div class="page">
    <div class="page-head"><div><h1>Quests</h1><p class="sub">Gib deiner Zeit ein Ziel. Jede Aufgabe kann auf eine Quest einzahlen.</p>
      ${hint("coherence", "Vertikale Kohärenz: Jede Stunde sollte auf ein größeres Ziel einzahlen.")}</div>
      <span class="grow"></span><button class="btn filled" data-quest="new"><span class="icon">add</span>Neue Quest</button></div>
    <div class="tiles">
      <div class="tile"><div class="k">Quest-Stunden gesamt</div><div class="v">${fmtHours(allSecs)}</div></div>
      <div class="tile"><div class="k">Aktiv</div><div class="v">${active.length}</div></div>
      <div class="tile"><div class="k">Abgeschlossen</div><div class="v">${completed.length}</div></div>
    </div>
    <div class="quest-tabs"><div class="segmented" role="group" aria-label="Quests filtern">
      <button data-quest-tab="active" aria-pressed="${state.questTab === "active"}">Aktiv · ${active.length}</button>
      <button data-quest-tab="completed" aria-pressed="${state.questTab === "completed"}">Abgeschlossen · ${completed.length}</button></div>
      <span class="muted">Kleine Schritte. Spürbare Ergebnisse.</span></div>
    ${cards ? `<div class="quest-grid">${cards}</div>` : `<div class="empty"><span class="icon">emoji_events</span><h3>Noch nichts abgeschlossen</h3><p>Abgeschlossene Quests erscheinen hier.</p></div>`}
  </div>`;
}

// --- Rückblick ------------------------------------------------------------

function stackedBar(segs, max, px) {
  const total = segs.reduce((a, x) => a + x.secs, 0);
  return `<div class="vbar" style="height:${(total / max) * px}px">${segs.filter((x) => x.secs > 0)
    .map((x) => `<span style="height:${(100 * x.secs) / total}%;background:${x.color}" title="${esc(x.label)}: ${fmtDur(x.secs)}"></span>`).join("")}</div>`;
}

function renderReview() {
  const monday = (state.reviewWeek ||= mondayOf(state.today));
  const days = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
  const sess = weekSessions(monday);
  const total = sumSecs(sess);
  const questSecs = sumSecs(sess.filter((s) => questOfSession(s)));
  const otherSecs = total - questSecs;
  const target = state.settings.weekly_target_hours;
  const targetPct = Math.round((100 * questSecs) / (target * 3600));
  const elapsed = monday > state.today ? 0 : Math.min(7, daysBetween(monday, state.today) + 1);
  const share = total ? Math.round((100 * questSecs) / total) : 0;
  const doneN = state.tasks.filter((t) => t.completed_at && (() => { const d = localDay(t.completed_at); return d >= monday && d <= days[6]; })()).length;

  const segsFor = (list) => [
    ...state.quests.map((q) => ({ label: q.title, color: q.color, secs: sumSecs(list.filter((s) => questOfSession(s)?.id === q.id)) })),
    { label: "Sonstiges", color: "var(--outline)", secs: sumSecs(list.filter((s) => !questOfSession(s))) },
  ];
  const PX = 140;
  const perDay = days.map((d) => sess.filter((s) => sessDay(s) === d));
  const dayMax = Math.max(3600, ...perDay.map(sumSecs));
  const dayChart = `<div class="chart">${perDay.map((list) => `<div class="bar-col"><span class="bar-val">${sumSecs(list) ? fmtDur(sumSecs(list)) : "–"}</span>${stackedBar(segsFor(list), dayMax, PX)}</div>`).join("")}</div>
    <div class="chart-labels">${days.map((d) => `<span class="${d === state.today ? "cur" : ""}">${WD_SHORT[weekdayIdx(d)]}</span>`).join("")}</div>`;

  const byQuest = state.quests.map((q) => ({ q, secs: sumSecs(sess.filter((s) => questOfSession(s)?.id === q.id)) }))

// Scrollposition von Zeitleiste und Wochenplan über Neuzeichnen hinweg behalten
function saveScroll(main) {
  for (const el of main.querySelectorAll("[data-scroll]")) state.scroll[`${main.dataset.rendered}:${el.dataset.scroll}`] = [el.scrollLeft, el.scrollTop];
}

function restoreScroll(main) {
  for (const el of main.querySelectorAll("[data-scroll]")) {
    const saved = state.scroll[`${state.view}:${el.dataset.scroll}`];
    if (saved) { [el.scrollLeft, el.scrollTop] = saved; continue; }
    if (el.dataset.scroll === "tl") {
      const hour = el.dataset.hasToday === "true" ? new Date(now()).getHours() - 2 : 7;
      el.scrollTop = Math.max(0, hour * HOUR_PX());
    } else if (el.dataset.scroll === "plan") {
      const col = el.querySelector(".today-col"), backlog = el.querySelector(".backlog");
      if (col && backlog) el.scrollLeft = col.offsetLeft - el.offsetLeft - (getComputedStyle(backlog).position === "sticky" ? backlog.offsetWidth + 12 : 0);
    }
  }
}

function render() {
  if (drag.active) { drag.renderPending = true; return; }
  for (const b of document.querySelectorAll(".toolbar [data-view]")) b.setAttribute("aria-pressed", b.dataset.view === state.view);
  renderChips();
  updatePill();
  if (!state.today) return;
  const tasks = visibleTasks();
  const main = document.getElementById("main");
  saveScroll(main);
  main.innerHTML = RENDERERS[state.view](tasks);
  main.dataset.rendered = state.view;
  restoreScroll(main);
  renderFocus();
}

// Lokale Werte (null) ↔ API-Werte ("" bzw. "none" entfernt ein Feld)
const toApi = (k, v) => v !== null && v !== undefined ? v : k === "priority" ? "none" : k === "tags" ? [] : k === "quest_id" ? 0 : "";
const toLocal = (k, v) => (k === "priority" && v === "none") || (k === "quest_id" && !v) || (v === "" && k !== "notes") ? null : v;

let snackTimer;
function snackbar(text, undo, label = "Rückgängig") {
  const el = document.getElementById("snack");
  el.innerHTML = `<span>${esc(text)}</span>${undo ? `<button type="button">${esc(label)}</button>` : ""}`;
  if (undo) el.querySelector("button").onclick = () => { el.classList.remove("show"); undo(); };
  el.classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => el.classList.remove("show"), undo ? 6000 : 3500);
}

const api = (method, id, body) => call(method, `/api/tasks/${id}`, body);

async function call(method, url, body) {
  const res = await fetch(url, {
    method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { location.href = "/login"; throw new Error("Nicht angemeldet"); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Fehler ${res.status}`);
  return data;
}

/** Ändert Felder sofort lokal, speichert im Hintergrund und bietet „Rückgängig“ an. */
async function saveTask(id, fields, message, undoable = true) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  const keys = Object.keys(fields);
  if ("due_date" in fields && !fields.due_date) keys.push("due_time");
  const before = Object.fromEntries(keys.map((k) => [k, t[k]]));
  const beforeCompleted = t.completed_at;
  for (const k of Object.keys(fields)) t[k] = toLocal(k, fields[k]);
  if ("due_date" in fields && !fields.due_date) t.due_time = null;
  if ("status" in fields && fields.status !== before.status) t.completed_at = fields.status === "done" ? new Date().toISOString() : null;
  state.pending++;
  render();
  try {
    Object.assign(t, await api("PATCH", id, fields));
    if (message) {
      const undoFields = Object.fromEntries(Object.entries(before).map(([k, v]) => [k, toApi(k, v)]));
      snackbar(message, undoable ? () => saveTask(id, undoFields, "Rückgängig gemacht", false) : null);
    }
  } catch (err) {
    Object.assign(t, before, { completed_at: beforeCompleted });
    snackbar("Nicht gespeichert: " + err.message);
  } finally {
    state.pending--;
    render();
    resync(); // Folgen auf dem Server, z. B. stoppt der Timer, wenn die Aufgabe erledigt ist
  }
}

/** Für Quests, Zeiteinträge und Einstellungen: speichern, dann alles neu laden. */
async function mutate(method, url, body, message, undo) {
  state.pending++;
  try {
    const data = await call(method, url, body);
    if (message) snackbar(message, undo);
    return data;
  } catch (err) {
    snackbar("Nicht gespeichert: " + err.message);
    throw err;
  } finally {
    state.pending--;
    await resync();
  }
}

function toggleDone(id) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  const done = t.status !== "done";
  saveTask(id, { status: done ? "done" : "todo" }, done ? "Erledigt" : "Wieder geöffnet");
}

function submitEdit(form) {
  const id = Number(form.dataset.task);
  const t = state.tasks.find((x) => x.id === id);
  const f = new FormData(form);
  const err = document.getElementById("form-error");
  const values = {
    title: f.get("title").trim(),
    notes: f.get("notes").trim(),
    status: f.get("status"),
    due_date: f.get("due_date"),
    due_time: f.get("due_date") ? f.get("due_time") : "",
    priority: f.get("priority"),
    project: f.get("project").trim(),
    tags: [...new Set(f.get("tags").split(",").map((x) => x.trim().replace(/^#/, "")).filter(Boolean))],
    quest_id: Number(f.get("quest_id")) || 0,
    plan_date: f.get("plan_date"),
  };
  if (!values.title) { err.textContent = "Der Titel darf nicht leer sein."; err.hidden = false; return; }
  if (!t) return document.getElementById("dlg").close();
  const changed = {};
  for (const [k, v] of Object.entries(values)) {
    if (JSON.stringify(v) !== JSON.stringify(toApi(k, t[k]))) changed[k] = v;
  }
  document.getElementById("dlg").close();
  if (Object.keys(changed).length) saveTask(id, changed, "Gespeichert");
}

// --- Fokus & Timer ----------------------------------------------------------

/** Startet oder pausiert den Timer einer Aufgabe; es läuft immer höchstens einer. */
async function togglePlay(id) {
  const t = taskById(id);
  if (!t) return;
  const run = running();
  const stopping = run?.task_id === id;
  const stampNow = new Date(now()).toISOString();
  if (run) run.ended_at = stampNow;
  if (!stopping) {
    state.sessions.push({ id: -Date.now(), task_id: id, started_at: stampNow, ended_at: null });
    if (t.status === "todo") t.status = "doing";
  }
  state.focusTask = id;
  state.pending++;
  render();
  try {
    await call("POST", "/api/focus", stopping ? {} : { task_id: id });
  } catch (err) {
    snackbar("Timer: " + err.message);
    state.etag = null; // vorläufigen Eintrag verwerfen
  } finally {
    state.pending--;
    await (state.etag ? resync() : load());
  }
}

/** Aufgaben für die Auswahl im Fokus: heutiger Plan, Quest-Arbeit zuerst. */
function focusCandidates() {
  const planned = sortTasks(state.tasks.filter((t) => isOpen(t) && plannedFor(t) === state.today));
  return [...planned.filter((t) => questById(t.quest_id)), ...planned.filter((t) => !questById(t.quest_id))];
}

function openFocus(id) {
  document.getElementById("dlg").close();
  state.focusTask = id ?? running()?.task_id ?? state.focusTask ?? null;
  const t = taskById(state.focusTask);
  if (!t || t.status === "done") state.focusTask = null;
  const dlg = document.getElementById("focus");
  renderFocus(true);
  if (!dlg.open) dlg.showModal();
}

function renderFocus(force = false) {
  const dlg = document.getElementById("focus");
  if (!dlg.open && !force) return;
  const body = document.getElementById("focus-body");
  if (body.contains(document.activeElement) && document.activeElement.tagName === "TEXTAREA") return; // nicht beim Tippen neu aufbauen
  const t = taskById(state.focusTask);
  const top = (label) => `<div class="focus-top"><button class="icon-btn" data-focus-close aria-label="Zurück" title="Zurück (Esc)"><span class="icon">arrow_back</span></button>
    <span class="label">${label}</span></div>`;
  const candidates = focusCandidates();
  if (!t) {
    const others = candidates.length ? candidates : sortTasks(state.tasks.filter(isOpen)).slice(0, 12);
    body.innerHTML = `<div class="focus-wrap">${top("Fokus")}<div class="focus-main"><div class="pick">
      <h3>${candidates.length ? "Woran willst du jetzt arbeiten?" : "Für heute ist nichts geplant – wähle eine offene Aufgabe:"}</h3>
      <div class="panel">${others.map((x) => `<div class="row" data-focus-pick="${x.id}" role="button" tabindex="0">
        <span class="icon status ${x.status}">${STATUS[x.status].icon}</span><span class="row-main"><div class="title">${esc(x.title)}</div>
        <div class="meta">${metaChips(x, { plan: false })}</div></span></div>`).join("") || `<div class="hint-row">Keine offenen Aufgaben.</div>`}</div>
    </div></div></div>`;
    return;
  }
  const q = questById(t.quest_id);
  const isRun = running()?.task_id === t.id;
  const open = isOpen(t);
  const others = candidates.filter((x) => x.id !== t.id);
  body.innerHTML = `<div class="focus-wrap">
    ${top(`${isRun ? `<span class="pulse"></span>` : ""}Fokus${q ? " · " + esc(q.title) : ""}`)}
    <div class="focus-main">
      ${q ? questTag(q) : ""}
      <div class="focus-title">${esc(t.title)}</div>
      <div class="focus-clock" data-live-task="${t.id}">${fmtClock(taskSecs(t.id))}</div>
      <div class="focus-state">${isRun ? "Läuft" : t.status === "done" ? "Erledigt" : "Pausiert"} · heute <span data-live-task-day="${t.id}">${fmtDur(taskSecs(t.id, state.today))}</span></div>
      <div class="focus-actions">${open ? `
        <button class="btn ${isRun ? "outlined" : "filled"}" data-play="${t.id}"><span class="icon fill">${isRun ? "pause" : "play_arrow"}</span>${isRun ? "Pause" : "Start"}</button>
        <button class="btn outlined" data-focus-done="${t.id}"><span class="icon">check</span>Erledigt</button>` : ""}
      </div>
      ${hint("one", "Nur diese eine Aufgabe zählt gerade.")}
    </div>
    <textarea class="notes-input focus-notes" data-focus-notes="${t.id}" placeholder="Notizen zur Aufgabe – werden beim Verlassen des Feldes gespeichert">${esc(t.notes)}</textarea>
    ${others.length ? `<div class="focus-next"><h3>Weitere Aufgaben für heute</h3><div class="switch-list">${others.map((x) => {
      const xq = questById(x.quest_id);
      return `<button class="chip" data-focus-pick="${x.id}">${xq ? `<span class="dot" style="background:${xq.color}"></span>` : ""}<span>${esc(x.title)}</span></button>`;
    }).join("")}</div></div>` : ""}
  </div>`;
}

/** Aufgabe im Fokus wechseln; läuft der Timer, läuft er für die neue Aufgabe weiter. */
function pickFocus(id) {
  const keepRunning = running() && running().task_id !== id;
  state.focusTask = id;
  renderFocus(true);
  if (keepRunning) togglePlay(id);
}

function focusDone(id) {
  const run = running();
  if (run?.task_id === id) run.ended_at = new Date(now()).toISOString();
  const next = focusCandidates().find((x) => x.id !== id);
  state.focusTask = next?.id ?? null;
  saveTask(id, { status: "done" }, "Erledigt");
}

function updatePill() {
  const pill = document.getElementById("run-pill");
  const run = running();
  const t = run && taskById(run.task_id);
  pill.classList.toggle("running", Boolean(run));
  pill.title = run ? "Fokus öffnen" : "Fokus-Modus";
  pill.innerHTML = run
    ? `<span class="pulse"></span><span class="clock">${fmtClock(taskSecs(run.task_id))}</span><span class="what">${esc(t?.title || "")}</span>`
    : `<span class="icon fill">play_circle</span><span class="what">Fokus</span>`;
  document.title = run ? `${fmtClock(taskSecs(run.task_id))} · ${t?.title || ""}` : "Aufgaben";
}

/** Sekundentakt: laufende Uhren aktualisieren, ohne alles neu zu zeichnen. */
function tick() {
  const run = running();
  if (!run) return;
  updatePill();
  const secs = taskSecs(run.task_id);
  for (const el of document.querySelectorAll(`[data-live-task="${run.task_id}"]`)) el.textContent = fmtClock(secs);
  for (const el of document.querySelectorAll(`[data-live-task-day="${run.task_id}"]`)) el.textContent = fmtDur(taskSecs(run.task_id, state.today));
  for (const el of document.querySelectorAll(`[data-live-day="${sessDay(run)}"]`)) el.textContent = fmtDur(sumSecs(daySessions(sessDay(run))));
}

async function submitQuest(form) {
  const f = new FormData(form);
  const values = { title: f.get("title").trim(), notes: f.get("notes").trim(), color: f.get("color") };
  const err = document.getElementById("form-error");
  if (!values.title) { err.textContent = "Gib der Quest einen Namen."; err.hidden = false; return; }
  const id = Number(form.dataset.questId);
  document.getElementById("dlg").close();
  if (!id) return mutate("POST", "/api/quests", values, "Quest angelegt").catch(() => {});
  const q = questById(id);
  const changed = Object.fromEntries(Object.entries(values).filter(([k, v]) => v !== q[k]));
  if (Object.keys(changed).length) mutate("PATCH", `/api/quests/${id}`, changed, "Gespeichert").catch(() => {});
}

function setQuestStatus(form, status) {
  const id = Number(form.dataset.questId);
  const back = status === "completed" ? "active" : "completed";
  document.getElementById("dlg").close();
  mutate("PATCH", `/api/quests/${id}`, { status }, status === "completed" ? "Quest abgeschlossen – stark!" : "Quest wieder aktiv",
    () => mutate("PATCH", `/api/quests/${id}`, { status: back }, "Rückgängig gemacht")).catch(() => {});
}

function deleteQuest(btn) {
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed");
    btn.textContent = "Wirklich löschen?";
    setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Löschen"; }, 4000);
    return;
  }
  const id = Number(btn.closest("form").dataset.questId);
  document.getElementById("dlg").close();
  mutate("DELETE", `/api/quests/${id}`, null, "Quest gelöscht – die Aufgaben bleiben erhalten").catch(() => {});
}

function openSession(id) {
  const s = id ? state.sessions.find((x) => x.id === id) : null;
  if (id && !s) return;
  const quarter = 15 * 60000;
  const endMs = s ? sessEnd(s) : Math.floor(now() / quarter) * quarter;
  const startMs = s ? sessStart(s) : endMs - 30 * 60000;
  const recent = addDays(state.today, -30);
  const pickable = state.tasks.filter((t) => isOpen(t) || t.id === s?.task_id || (t.completed_at && localDay(t.completed_at) >= recent));
  const groups = [...state.quests.map((q) => [q.title, pickable.filter((t) => t.quest_id === q.id)]), ["Ohne Quest", pickable.filter((t) => !questById(t.quest_id))]]
    .filter(([, l]) => l.length);
  const selected = s?.task_id ?? state.focusTask ?? focusCandidates()[0]?.id;
  const options = groups.map(([label, l]) => `<optgroup label="${esc(label)}">${sortTasks(l).map((t) =>
    `<option value="${t.id}" ${t.id === selected ? "selected" : ""}>${esc(t.title)}${t.status === "done" ? " ✓" : ""}</option>`).join("")}</optgroup>`).join("");
  const body = document.getElementById("dlg-body");
  body.innerHTML = `<form class="dlg" id="session-form" data-session-id="${s?.id || ""}" autocomplete="off">
    <div class="dlg-head"><h3>${s ? "Zeiteintrag" : "Zeit nachtragen"}</h3>
      <button type="button" class="icon-btn" data-close aria-label="Schließen"><span class="icon">close</span></button></div>
    <div class="form">
      <label class="f"><span class="icon">task_alt</span><select name="task_id" required aria-label="Aufgabe">${options}</select></label>
      <label class="f"><span class="icon">event</span><span class="lbl">Datum</span><input type="date" name="date" required value="${isoDate(new Date(startMs))}"></label>
      <div class="f"><span class="icon">schedule</span><span class="lbl">Zeit</span><div class="pair">
        <input type="time" name="start" required value="${hhmm(startMs)}" aria-label="Beginn">
        <input type="time" name="end" required value="${hhmm(endMs)}" aria-label="Ende"></div></div>
    </div>
    <div class="form-error" id="form-error" hidden></div>
    <div class="dlg-actions">
      ${s ? `<button type="button" class="btn danger" data-delete-session>Löschen</button>` : ""}
      <span class="spacer"></span>
      <button type="button" class="btn text" data-close>Abbrechen</button>
      <button type="submit" class="btn filled">${s ? "Speichern" : "Eintragen"}</button>
    </div>
  </form>`;
  showForm(body);
}

function submitSession(form) {
  const f = new FormData(form);
  const err = document.getElementById("form-error");
  const date = f.get("date"), start = f.get("start"), end = f.get("end");
  if (!f.get("task_id")) { err.textContent = "Wähle eine Aufgabe."; err.hidden = false; return; }
  if (end <= start) { err.textContent = "Das Ende muss nach dem Beginn liegen."; err.hidden = false; return; }
  const body = { task_id: Number(f.get("task_id")), started_at: `${date}T${start}`, ended_at: `${date}T${end}` };
  const id = Number(form.dataset.sessionId);
  document.getElementById("dlg").close();
  mutate(id ? "PATCH" : "POST", id ? `/api/sessions/${id}` : "/api/sessions", body, id ? "Gespeichert" : "Zeit eingetragen").catch(() => {});
}

function deleteSession(btn) {
  if (!btn.classList.contains("armed")) {
    btn.classList.add("armed");
    btn.textContent = "Wirklich löschen?";
    setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Löschen"; }, 4000);

/** Angelegte Aufgaben sofort zeigen; das Live-Ereignis bestätigt sie kurz darauf. */
function mergeTasks(tasks) {
  for (const t of tasks) if (!taskById(t.id)) state.tasks.push(t);
  render();
}

async function submitCompose(form, useAgent) {
  const text = form.text.value.trim();
  const err = document.getElementById("form-error");
  if (!text) { err.textContent = "Beschreib zuerst, was zu tun ist."; err.hidden = false; return; }
  const btn = document.getElementById("compose-submit");
  for (const b of form.querySelectorAll("button")) b.disabled = true;
  err.hidden = true;
  let reply, tasks;
  try {
    if (useAgent) {
      btn.innerHTML = `<span class="spinner"></span>Wird angelegt …`;
      ({ reply, tasks } = await call("POST", "/api/agent", { text }));
    } else {
      const [first, ...rest] = text.split("\n");
      tasks = [await call("POST", "/api/tasks", { title: first.trim().slice(0, 200), notes: rest.join("\n").trim() })];
      reply = "Aufgabe angelegt.";
    }
  } catch (e) {
    for (const b of form.querySelectorAll("button")) b.disabled = false;
    btn.innerHTML = useAgent ? `<span class="icon">auto_awesome</span>Anlegen` : "Anlegen";
    err.textContent = e.message;
    err.hidden = false;
    return;
  }
  mergeTasks(tasks);
  showComposeResult(reply, tasks, text);
}

function showComposeResult(reply, tasks, text) {
  const body = document.getElementById("dlg-body");
  body.innerHTML = `<div class="dlg composer" data-created="${tasks.map((t) => t.id).join(",")}">
    <div class="dlg-head"><h3>${tasks.length === 1 ? "Aufgabe angelegt" : `${tasks.length} Aufgaben angelegt`}</h3>
      <button type="button" class="icon-btn" data-close aria-label="Schließen"><span class="icon">close</span></button></div>
    ${reply ? `<p class="agent-reply"><span class="icon fill">auto_awesome</span>${esc(reply)}</p>` : ""}
    <div class="panel created">${tasks.map((t) => row(taskById(t.id) || t)).join("")}</div>
    <p class="muted" style="margin-top:10px">Zum Bearbeiten antippen.</p>
    <div class="dlg-actions">
      <button type="button" class="btn danger" data-agent-undo>Rückgängig</button>
      <span class="spacer"></span>
      <button type="button" class="btn text" data-compose-again>Noch eine</button>
      <button type="button" class="btn filled" data-close>Fertig</button>
    </div></div>`;
  body.querySelector("[data-agent-undo]").dataset.text = text;
}

async function undoCompose(btn) {
  const ids = btn.closest("[data-created]").dataset.created.split(",").map(Number);
  document.getElementById("dlg").close();
  try {
    await Promise.all(ids.map((id) => api("DELETE", id)));
    state.tasks = state.tasks.filter((t) => !ids.includes(t.id));
    render();
    const text = btn.dataset.text;
    snackbar(ids.length === 1 ? "Aufgabe entfernt" : "Aufgaben entfernt", () => openComposer(text), "Text bearbeiten");
  } catch (e) {
    snackbar("Nicht entfernt: " + e.message);
  }
}

// --- Ziehen (Board: Status, Kalender: Datum, Planen: Tag) -------------------------------

const drag = { el: null, id: null, x0: 0, y0: 0, dx: 0, dy: 0, type: "", active: false, timer: 0, ghost: null, target: null, suppressClick: false, renderPending: false };

function dropTargetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest("[data-drop-status], .day[data-day], [data-drop-plan]") : null;
}

function startDrag(x, y) {
  clearTimeout(drag.timer);
  if (!drag.el || !document.body.contains(drag.el)) return resetDrag();
  drag.active = true;
  const rect = drag.el.getBoundingClientRect();
  drag.dx = x - rect.left; drag.dy = y - rect.top;
  const ghost = drag.el.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.removeAttribute("data-drag");
  ghost.style.width = Math.min(rect.width, 320) + "px";
  document.body.appendChild(ghost);
  drag.ghost = ghost;
  drag.el.classList.add("drag-source");
  document.body.classList.add("dragging");
  navigator.vibrate?.(12);
  moveDrag(x, y);
}

function moveDrag(x, y) {
  drag.ghost.style.transform = `translate(${x - drag.dx}px, ${y - drag.dy}px) rotate(2deg)`;
  const target = dropTargetAt(x, y);
  if (target !== drag.target) {
    drag.target?.classList.remove("drop-target");
    target?.classList.add("drop-target");
    drag.target = target;
  }
  // Am Rand mitscrollen (Board auf dem Handy horizontal, Seite vertikal)
  const board = document.querySelector(".board");
  if (board && board.scrollWidth > board.clientWidth) {
    if (x < 40) board.scrollLeft -= 14; else if (x > innerWidth - 40) board.scrollLeft += 14;
  }
  if (y < 80) scrollBy(0, -14); else if (y > innerHeight - 60) scrollBy(0, 14);
}

function finishDrag() {
  const t = state.tasks.find((x) => x.id === drag.id);
  const target = drag.target;
  resetDrag();
  drag.suppressClick = true;
  setTimeout(() => { drag.suppressClick = false; }, 50);
  if (!t || !target) return;
  const status = target.dataset.dropStatus;
  const day = target.dataset.day;
  if (status && status !== t.status) saveTask(t.id, { status }, `Verschoben nach „${STATUS[status].label}“`);
  if (day && day !== t.due_date) saveTask(t.id, { due_date: day }, `Verschoben auf ${longDate(day)}`);
  const plan = target.dataset.dropPlan;
  if (plan !== undefined && plan !== (t.plan_date || "")) {
    saveTask(t.id, { plan_date: plan }, plan ? `Eingeplant für ${relDay(plan)}` : "Aus dem Plan genommen");
  }
}

function resetDrag() {
  clearTimeout(drag.timer);
  drag.ghost?.remove();
  drag.el?.classList.remove("drag-source");
  drag.target?.classList.remove("drop-target");
  document.body.classList.remove("dragging");
  const pending = drag.renderPending;
  Object.assign(drag, { el: null, id: null, active: false, ghost: null, target: null, renderPending: false });
  if (pending) render();
}

document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest("[data-drag]");
  if (!el || e.button > 0 || e.target.closest("[data-toggle]")) return;
  Object.assign(drag, { el, id: Number(el.dataset.drag), x0: e.clientX, y0: e.clientY, type: e.pointerType, active: false });
  // Touch: erst nach langem Drücken ziehen, damit normales Scrollen funktioniert
  if (e.pointerType !== "mouse") drag.timer = setTimeout(() => startDrag(drag.x0, drag.y0), 380);
});
document.addEventListener("pointermove", (e) => {
  if (!drag.el) return;
  if (drag.active) return moveDrag(e.clientX, e.clientY);
  const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  if (drag.type === "mouse" && dist > 6) startDrag(e.clientX, e.clientY);
  else if (drag.type !== "mouse" && dist > 10) resetDrag();
});
document.addEventListener("pointerup", () => { if (drag.active) finishDrag(); else resetDrag(); });
document.addEventListener("pointercancel", () => { if (!drag.active) resetDrag(); });
document.addEventListener("touchmove", (e) => {
  if (!drag.active) return;
  e.preventDefault();
  const p = e.touches[0];
  if (p) moveDrag(p.clientX, p.clientY);
}, { passive: false });
document.addEventListener("touchend", () => { if (drag.active) finishDrag(); });
document.addEventListener("contextmenu", (e) => { if (drag.active || drag.timer && drag.el) e.preventDefault(); });

// --- Daten ----------------------------------------------------------------

// ETag "<version>-<datum>": die Version zählt jede Schreiboperation auf dem Server
const etagVersion = (etag) => parseInt(String(etag).slice(1), 10) || 0;

async function load() {
  try {
    const res = await fetch("/api/tasks", { headers: state.etag ? { "If-None-Match": state.etag } : {}, cache: "no-store" });
    if (res.status === 401) { location.href = "/login"; return; }
    if (res.status === 304) return setSync();
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const etag = res.headers.get("ETag");
    setSync();
    if (state.pending) return; // laufende Änderung nicht mit älterem Stand überschreiben
    if (etagVersion(etag) < etagVersion(state.etag) && data.today === state.today) return; // Live-Ereignis war schneller
    state.etag = etag;
    state.tasks = data.tasks;
    state.quests = data.quests;
    state.sessions = data.sessions;
    state.settings = data.settings;
    state.today = data.today;
    state.clockOffset = Date.parse(data.now) - Date.now();
    render();
    if (state.openAfterLoad) { const id = state.openAfterLoad; state.openAfterLoad = null; openTask(id); }
    if (!store.get("todo.guideSeen")) {
      store.set("todo.guideSeen", "1");
      snackbar("Neu: die Prinzipien hinter Heute, Planen und Fokus", () => openGuide(), "Ansehen");
    }
  } catch {
    setSync(false);
  }
}

// --- Echtzeit (Server-Sent Events) ------------------------------------------
// Jede Änderung – hier, auf dem Handy oder durch Claude – schickt der Server sofort als Ereignis
// mit den geänderten Zeilen. Ohne Verbindung fällt die Seite auf Abfragen alle 10 s zurück.

let events = null;
const liveOk = () => events?.readyState === EventSource.OPEN;

function setSync(reachable = true) {
  const sync = document.getElementById("sync");
  const live = reachable && liveOk();
  sync.classList.toggle("stale", !live);
  sync.title = live ? "Live verbunden" : reachable ? "Verbinde live …" : "Offline – letzte Daten werden angezeigt";
}

function connectLive() {
  events?.close();
  const source = (events = new EventSource("/api/events"));
  source.onopen = () => { setSync(); load(); }; // nach (Wieder-)Verbindung Verpasstes holen
  source.onmessage = (e) => applyChanges(JSON.parse(e.data));
  source.onerror = () => {
    setSync(navigator.onLine);
    // Bei Fehlerantworten (z. B. abgelaufene Anmeldung) gibt EventSource auf; dann selbst neu versuchen
    if (source.readyState === EventSource.CLOSED) setTimeout(() => { if (events === source) { load(); connectLive(); } }, 5000);
  };
}

const ORDER = {
  tasks: (a, b) => a.id - b.id,
  quests: (a, b) => (a.status === "completed") - (b.status === "completed") || a.id - b.id,
  sessions: (a, b) => sessStart(a) - sessStart(b),
};

function applyChanges(data) {
  if (!state.today || etagVersion(data.etag) < etagVersion(state.etag)) return; // Erstladen läuft noch bzw. schon neuer
  for (const key of Object.keys(ORDER)) {
    const rows = data[key] || [], gone = data.deleted[key] || [];
    if (!rows.length && !gone.length) continue;
    const drop = new Set([...gone, ...rows.map((r) => r.id)]);
    // Vorläufige Einträge (negative IDs, z. B. ein gerade gestarteter Timer) ersetzt der Server
    state[key] = [...state[key].filter((x) => !drop.has(x.id) && x.id > 0), ...rows].sort(ORDER[key]);
  }
  if (data.settings) state.settings = data.settings;
  state.etag = data.etag;
  render();
}

/** Nach eigenen Änderungen: live kommt das Ergebnis als Ereignis, sonst selbst nachladen. */
function resync() {
  if (liveOk()) return;
  state.etag = null;
  return load();
}


// --- App & Benachrichtigungen ---------------------------------------------

const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let swReady = null;
if ("serviceWorker" in navigator) {
  swReady = navigator.serviceWorker.register("/sw.js").then(() => navigator.serviceWorker.ready).catch(() => null);
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data?.type === "open") { location.hash = new URL(e.data.url).hash; openFromHash(); }
  });
}

const b64ToBytes = (b64) => {
  const raw = atob((b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
};

async function currentSubscription() {
  const reg = await swReady;
  return reg ? reg.pushManager.getSubscription() : null;
}

async function updateBell() {
  const sub = pushSupported ? await currentSubscription().catch(() => null) : null;
  const bell = document.getElementById("bell");
  if (!bell) return;
  bell.querySelector(".icon").textContent = sub ? "notifications_active" : "notifications";
  bell.querySelector(".icon").classList.toggle("fill", Boolean(sub));
}

async function postJson(url, method, body) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Fehler ${res.status}`);
  return res.status === 204 ? null : res.json();
}

async function enablePush() {
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("Benachrichtigungen wurden nicht erlaubt");
  const reg = await swReady;
  if (!reg) throw new Error("Service Worker nicht verfügbar");
  const { publicKey } = await (await fetch("/api/push")).json();
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
  await postJson("/api/push", "POST", sub.toJSON());
}

async function disablePush() {
  const sub = await currentSubscription();
  if (!sub) return;
  await postJson("/api/push", "DELETE", { endpoint: sub.endpoint }).catch(() => {});
  await sub.unsubscribe();
}

async function openNotify() {
  const sub = pushSupported ? await currentSubscription().catch(() => null) : null;
  const standalone = matchMedia("(display-mode: standalone)").matches;
  const body = document.getElementById("dlg-body");
  let content;
  if (!pushSupported) {
    content = `<p>Dieser Browser unterstützt keine Push-Benachrichtigungen.${standalone ? "" : " Installiere die App über das Chrome-Menü (⋮ → „App installieren“) und versuche es dort erneut."}</p>`;
  } else if (Notification.permission === "denied") {
    content = `<p>Benachrichtigungen sind für diese Seite blockiert. Erlaube sie in den App- bzw. Website-Einstellungen und öffne diesen Dialog erneut.</p>`;
  } else {
    content = `<p>Du bekommst eine Nachricht auf dieses Gerät:</p>
      <ul><li>wenn eine Aufgabe mit Uhrzeit fällig wird</li><li>um 20:00 Uhr mit allem, was morgen fällig ist</li></ul>
      <div class="state"><span class="icon ${sub ? "fill" : ""}">${sub ? "notifications_active" : "notifications_off"}</span>
        ${sub ? "Auf diesem Gerät aktiv" : "Auf diesem Gerät aus"}</div>`;
  }
  const actions = !pushSupported || Notification.permission === "denied"
    ? `<span class="spacer"></span><button type="button" class="btn text" data-close>Schließen</button>`
    : sub
      ? `<button type="button" class="btn danger" id="push-off">Ausschalten</button><span class="spacer"></span>
         <button type="button" class="btn text" id="push-test">Test senden</button><button type="button" class="btn filled" data-close>Fertig</button>`
      : `<span class="spacer"></span><button type="button" class="btn text" data-close>Später</button>
         <button type="button" class="btn filled" id="push-on">Aktivieren</button>`;
  body.innerHTML = `<div class="dlg notify">
    <div class="dlg-head"><h3>Benachrichtigungen</h3>
      <button type="button" class="icon-btn" data-close aria-label="Schließen"><span class="icon">close</span></button></div>
    ${content}
    <div class="dlg-actions">${actions}</div></div>`;
  const run = (id, fn, ok) => document.getElementById(id)?.addEventListener("click", async () => {
    try { await fn(); if (ok) snackbar(ok); } catch (err) { snackbar(err.message); }
    await updateBell();
    if (id !== "push-test") openNotify();
  });
  run("push-on", enablePush, "Benachrichtigungen aktiviert");
  run("push-off", disablePush, "Benachrichtigungen ausgeschaltet");
  run("push-test", () => postJson("/api/push/test", "POST"), "Testnachricht gesendet");
  const dlg = document.getElementById("dlg");
  if (!dlg.open) dlg.showModal();
}


function openFromHash() {
  const m = /^#task-(\d+)$/.exec(location.hash);
  if (!m) return false;
  const id = Number(m[1]);
  history.replaceState(null, "", "#" + state.view);
  if (state.tasks.some((t) => t.id === id)) openTask(id);
  else state.openAfterLoad = id;
  return true;
}

// --- Interaktion ----------------------------------------------------------

function setView(view) {
  state.view = VIEWS.includes(view) ? view : "today";
  store.set("todo.view", state.view);
  if (location.hash.slice(1) !== state.view) history.replaceState(null, "", "#" + state.view);
  render();
}

document.addEventListener("click", (e) => {
  if (drag.suppressClick) { e.preventDefault(); return; }
  const el = e.target.closest(`[data-toggle], [data-view], [data-project], [data-close], [data-delete], [data-clear-date], [data-id], [data-day], [data-cal],
    [data-play], [data-plan-today], [data-focus-open], [data-focus-pick], [data-focus-close], [data-focus-done], [data-quest], [data-quest-tab],
    [data-quest-status], [data-delete-quest], [data-session], [data-delete-session], [data-log], [data-week], [data-cal-mode], [data-target],
    [data-clear-plan], [data-guide], [data-guide-go], [data-guide-close], [data-compose], [data-settings], [data-example],
    [data-manual], [data-agent-undo], [data-compose-again], [data-load-models], [data-clear-key], [data-open-notify],
    [data-tfa], [data-logout-all], [data-copy-codes], #run-pill`);
  if (!el) {
    if (e.target.id === "dlg") e.target.close();
    return;
  }
  if (el.dataset.tfa === "setup") return startTwoFactor();
  if (el.dataset.tfa) return askCode(el.dataset.tfa);
  if (el.dataset.logoutAll !== undefined) return logoutEverywhere(el);
  if (el.dataset.copyCodes) {
    return navigator.clipboard?.writeText(el.dataset.copyCodes).then(() => snackbar("Codes kopiert"), () => snackbar("Kopieren nicht möglich"));
  }
  if (el.dataset.compose !== undefined) return openComposer();
  if (el.dataset.settings !== undefined) return openSettings(el.dataset.settings);
  if (el.dataset.example) { const f = el.closest("form"); f.text.value = el.dataset.example; return f.text.focus(); }
  if (el.dataset.manual !== undefined) return submitCompose(el.closest("form"), false);
  if (el.dataset.agentUndo !== undefined) return undoCompose(el);
  if (el.dataset.composeAgain !== undefined) return openComposer();
  if (el.dataset.loadModels !== undefined) return loadModels(el);
  if (el.dataset.clearKey !== undefined) return saveAgentConfig(el.closest("form"), true);
  if (el.dataset.openNotify !== undefined) return openNotify();
  if (el.dataset.guide !== undefined) return openGuide(el.dataset.guide);
  if (el.dataset.guideGo) return guideGo(el.dataset.guideGo);
  if (el.dataset.guideClose !== undefined) return document.getElementById("guide").close();
  if (el.dataset.toggle) return toggleDone(Number(el.dataset.toggle));
  if (el.dataset.play) return togglePlay(Number(el.dataset.play));
  if (el.dataset.planToday) return planToday(Number(el.dataset.planToday));
  if (el.id === "run-pill") return openFocus();
  if (el.dataset.focusOpen) return openFocus(Number(el.dataset.focusOpen));
  if (el.dataset.focusPick) return pickFocus(Number(el.dataset.focusPick));
  if (el.dataset.focusClose !== undefined) return document.getElementById("focus").close();
  if (el.dataset.focusDone) return focusDone(Number(el.dataset.focusDone));
  if (el.dataset.quest) return openQuest(el.dataset.quest === "new" ? null : Number(el.dataset.quest));
  if (el.dataset.questTab) { state.questTab = el.dataset.questTab; return render(); }
  if (el.dataset.questStatus) return setQuestStatus(el.closest("form"), el.dataset.questStatus);
  if (el.dataset.deleteQuest !== undefined) return deleteQuest(el);
  if (el.dataset.session) return openSession(Number(el.dataset.session));
  if (el.dataset.deleteSession !== undefined) return deleteSession(el);
  if (el.dataset.log !== undefined) return openSession(null);
  if (el.dataset.target !== undefined) return openTarget();
  if (el.dataset.clearPlan !== undefined) { el.closest("form").plan_date.value = ""; return; }
  if (el.dataset.calMode) { state.calMode = el.dataset.calMode; store.set("todo.calMode", state.calMode); return render(); }
  if (el.dataset.week) {
    const key = state.view === "review" ? "reviewWeek" : "planWeek";
    const cur = state[key] || mondayOf(state.today);
    state[key] = el.dataset.week === "today" ? mondayOf(state.today) : addDays(cur, el.dataset.week === "next" ? 7 : -7);
    return render();
  }
  if (el.dataset.view) {
    if (document.getElementById("dlg").open) document.getElementById("dlg").close();
    return setView(el.dataset.view);
  }
  if (el.dataset.project !== undefined) { state.project = el.dataset.project || null; return render(); }
  if (el.dataset.close !== undefined) return document.getElementById("dlg").close();
  if (el.dataset.delete !== undefined) return deleteTask(el);
  if (el.dataset.clearDate !== undefined) {
    const form = el.closest("form");
    form.due_date.value = ""; form.due_time.value = "";
    return;
  }
  if (el.dataset.id) return openTask(Number(el.dataset.id));
  if (el.dataset.day) { state.calSelected = el.dataset.day; return render(); }
  if (el.dataset.cal && state.calMode === "week") {
    state.calWeek = el.dataset.cal === "today" ? mondayOf(state.today) : addDays(state.calWeek || mondayOf(state.today), el.dataset.cal === "next" ? 7 : -7);
    return render();
  }
  if (el.dataset.cal) {
    if (el.dataset.cal === "today") { state.calMonth = state.today.slice(0, 7); state.calSelected = state.today; }
    else {
      const [y, m] = state.calMonth.split("-").map(Number);
      const d = new Date(y, m - 1 + (el.dataset.cal === "next" ? 1 : -1), 1);
      state.calMonth = isoDate(d).slice(0, 7);
    }
    render();
  }
});

document.addEventListener("submit", (e) => {
  const handlers = {
    edit: submitEdit, "quest-form": submitQuest, "session-form": submitSession,
    "agent-form": (form) => submitCompose(form, Boolean(agentConfig?.ready)),
    "agent-config": (form) => saveAgentConfig(form),
    "tfa-enable": submitTwoFactor, "tfa-code": submitTwoFactor,
    "target-form": (form) => {
      document.getElementById("dlg").close();
      mutate("PATCH", "/api/settings", { weekly_target_hours: Number(form.hours.value) }, "Wochenziel gespeichert").catch(() => {});
    },
  };
  if (!handlers[e.target.id]) return;
  e.preventDefault();
  handlers[e.target.id](e.target);
});
// Notizen im Fokus beim Verlassen des Feldes speichern
document.addEventListener("focusout", (e) => {
  const id = Number(e.target.dataset?.focusNotes);
  const t = id && taskById(id);
  if (t && e.target.value.trim() !== t.notes) saveTask(id, { notes: e.target.value.trim() }, "Notizen gespeichert", false);
});
document.getElementById("focus").addEventListener("close", () => render());
document.getElementById("q").addEventListener("input", (e) => { state.query = e.target.value; render(); });
document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  const inFocus = document.getElementById("focus").open;
  if (inFocus && e.key === " " && !typing && state.focusTask && !document.activeElement.matches("button")) {
    e.preventDefault();
    return togglePlay(state.focusTask);
  }
  if (e.key === "/" && !typing && !inFocus) { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "?" && !typing) { e.preventDefault(); openGuide(); }
  if (e.key === "n" && !typing && !e.metaKey && !e.ctrlKey && !document.querySelector("dialog[open]")) { e.preventDefault(); openComposer(); }
  if (e.key === "Enter" && !typing && document.activeElement.matches?.("[data-focus-pick]")) return pickFocus(Number(document.activeElement.dataset.focusPick));
  if (e.key === "Enter" && !typing && document.activeElement.matches?.("[data-id]")) openTask(Number(document.activeElement.dataset.id));
});
window.addEventListener("hashchange", () => { if (!openFromHash()) setView(location.hash.slice(1)); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  load();
  if (!events || events.readyState === EventSource.CLOSED) connectLive();
});
setInterval(() => { if (!document.hidden && !liveOk()) load(); }, 10000);
setInterval(() => { if (!document.hidden) load(); }, 300000); // Datumswechsel; kostet live nur ein 304
setInterval(tick, 1000);
// Laufende Blöcke in der Zeitleiste und den Wochenfortschritt minütlich nachziehen
setInterval(() => { if (running() && !document.hidden) render(); }, 60000);

const startHash = location.hash.slice(1);
state.view = VIEWS.includes(startHash) ? startHash : store.get("todo.view") || "today";
state.calMode = store.get("todo.calMode") === "week" ? "week" : "month";
openFromHash();
setView(state.view);
load();
connectLive();
updateBell();
</script>
</body>
</html>
