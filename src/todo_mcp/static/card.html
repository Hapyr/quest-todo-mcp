<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}} · Aufgaben</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%230b57d0'/%3E%3Cpath d='M7 12.5l3.2 3.2L17 9' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f9; --surface: #ffffff; --text: #1f1f1f; --text-2: #444746; --outline: #747775;
    --primary: #0b57d0; --on-primary: #ffffff; --error: #b3261e; --hover: rgba(11, 87, 208, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131314; --surface: #1e1f20; --text: #e3e3e3; --text-2: #c4c7c5; --outline: #8e918f;
      --primary: #a8c7fa; --on-primary: #062e6f; --error: #f2b8b5; --hover: rgba(168, 199, 250, .08);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 400 15px/1.5 "Google Sans Flex", "Google Sans", Roboto, system-ui, sans-serif;
  }
  .card { width: 100%; max-width: 420px; background: var(--surface); border-radius: 28px; padding: 40px 36px 32px; }
  .logo { width: 40px; height: 40px; margin-bottom: 16px; }
  h1 { font-size: 28px; font-weight: 400; margin: 0 0 8px; letter-spacing: -.2px; }
  .sub { color: var(--text-2); margin: 0 0 28px; }
  .field { position: relative; display: block; }
  .field input {
    width: 100%; height: 56px; padding: 18px 16px 6px; font: inherit; font-size: 16px; color: var(--text);
    background: transparent; border: 1px solid var(--outline); border-radius: 6px; outline: none;
  }
  .field input:focus { border: 2px solid var(--primary); padding-left: 15px; }
  .field span {
    position: absolute; left: 12px; top: 17px; padding: 0 4px; color: var(--text-2); pointer-events: none;
    background: var(--surface); transition: all .15s ease;
  }
  .field input:focus + span, .field input:not(:placeholder-shown) + span { top: -9px; font-size: 12px; }
  .field input:focus + span { color: var(--primary); }
  .error { color: var(--error); font-size: 13px; margin: 8px 4px 0; }
  .field + .field { margin-top: 16px; }
  .hint { color: var(--text-2); font-size: 12.5px; margin: 8px 4px 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 32px; }
  button {
    height: 40px; padding: 0 24px; border-radius: 20px; border: 0; font: 500 14px/1 inherit; cursor: pointer;
    font-family: inherit;
  }
  .filled { background: var(--primary); color: var(--on-primary); }
  .filled:hover { box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .text { background: transparent; color: var(--primary); }
  .text:hover { background: var(--hover); }
</style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--primary)"/><path d="M7 12.5l3.2 3.2L17 9" stroke="var(--on-primary)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    {{body}}
  </main>
</body>
</html>
